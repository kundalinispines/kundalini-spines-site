name: Deploy site to Cloudflare Pages

# The site is static with no build step, so this only has to copy the public
# files into _site and hand it to Cloudflare Pages by DIRECT UPLOAD
# (`wrangler pages deploy`), not by Git integration. That choice is load-bearing:
# with direct upload, Cloudflare only ever receives the assembled _site — the
# handoffs, labs, scripts and design material never leave the runner. A
# Git-connected Pages project would clone the whole repo into Cloudflare's
# build environment instead, and the allowlist would guard one copy of the
# tree while another sat outside it.
#
# This file is the ported successor of deploy-pages.yml (retired 30 Aug 2026,
# in git history). The three guard steps below — assemble-from-allowlist,
# accounting, leak guard — are carried over verbatim from it, including their
# comments, because those comments record a real leak that almost shipped
# (a denylist glob anchored at `HANDOFF` that a `V2` prefix walked straight
# past — see the leak-guard step). Only the deploy tail changed hosts.
#
# IMPORTANT: it does NOT publish the whole repo. The handoffs contain local
# Windows paths, internal notes and Higgsfield element IDs; docs/, design/ and
# reference/ hold planning material and art-direction inputs; scripts/ is the
# local toolchain; links.html and the ~13 *-lab.html harnesses (plus
# raster-test*, transmissions-option*) are internal design rigs. All of that is
# fine in a private repo and none of it should be readable at a public URL.
#
# WHY THIS IS AN ALLOWLIST AND NOT AN EXCLUDE LIST — 12 August 2026.
# It used to be `tar --exclude=...`, a denylist. It leaked, and the leak was
# invisible for eleven sessions, because of one pattern:
#
#     --exclude='./HANDOFF*.md'
#
# The live handoff series on this branch is named `V2HANDOFF 19.md` …
# `V2HANDOFF 29.md`. **A glob anchored at `HANDOFF` does not match a filename
# that STARTS with `V2`.** Every V2 handoff — local paths, internal notes and
# all — would have been published. The prefix was added when the V2 branch
# opened and nobody re-read the workflow.
#
# The safety net had the identical hole. The "Fail if anything internal slipped
# through" step below checked `-name 'HANDOFF*'`, i.e. **the guard matched the
# same set the exclude matched, so it would have reported "Clean" while the
# leak happened.** A guard that mirrors the rule it guards is not a guard.
# It is the same bug written twice.
#
# A denylist fails open: forget a line and the file ships. An allowlist fails
# closed: forget a line and a page 404s, which is loud, cheap and reversible.
# The public surface here is thirteen root files and six directories and has
# grown by a few pages over the whole V2 line, so the maintenance cost of
# enumerating it is near zero — while the cost of the denylist was already paid.
#
# The known objection to allowlists is that a new public page silently
# disappears. The "Verify every public page is accounted for" step below closes
# that: it fails the build if a root-level .html exists that is neither
# allowlisted nor recognisably internal, so adding a page forces a decision
# here rather than letting one rot unpublished.
#
# If you add a public page: add it to PUBLIC below. If you add an internal
# document: you do not have to do anything — but if it is a root .html, teach
# the INTERNAL_HTML pattern list about it so the accounting step stays quiet.
#
# SECRETS this workflow needs (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — scoped token, "Cloudflare Pages — Edit" only.
#   CLOUDFLARE_ACCOUNT_ID  — the account id, not a secret in the cryptographic
#                            sense, but kept out of the public tree all the same.
# Neither may ever appear in the repo itself — same rule as the Stripe secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let one deployment finish rather than cancelling it mid-publish.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # v5 targets Node 24; v4 drew a deprecation warning on every run after
      # GitHub retired Node 20 on its runners (Sept 2025 changelog). The
      # wrangler-action@v3 warning below it stays until Cloudflare ships a
      # Node-24 target — it runs fine on the forced runtime meanwhile.
      - name: Checkout
        uses: actions/checkout@v5

      # `cp -R` of an explicit list rather than tar with excludes: with an
      # allowlist there is nothing to exclude, and cp needs no pattern language
      # whose anchoring rules can surprise you the way tar's just did.
      #
      # Every path below is quoted and `cp` is given `--`, because this repo has
      # real filenames with spaces and commas in them (see
      # assets/messengers/'ChatGPT Image Aug 11, 2026, 05_39_00 PM.png').
      # An unquoted loop here would split that into three bogus paths and the
      # copy would half-fail.
      - name: Assemble the public site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          # THE PUBLIC SURFACE. Verified 12 Aug 2026 against `git ls-files`,
          # the README page inventory, sitemap.xml, and every href/src/fetch()
          # in the public pages. Nothing else ships.
          # Re-verified 28 Aug 2026 when the purchase pages were added: root
          # .html count is 33 = 10 public + 23 internal (18 *-lab.html,
          # links.html, 2 raster-test*.html, 2 transmissions-option*.html).
          PUBLIC=(
            # Pages (10). music.html is a deliberate redirect to /#tracks and is
            # kept so bookmarks survive — see README "Deliberate oddities".
            'index.html'
            'about.html'
            'archive.html'
            'connect.html'
            'merch.html'
            'music.html'
            'transmissions.html'
            # The purchase surface, added 28 Aug 2026. The nav's Album entry
            # points at purchase.html on every page, so shipping the nav
            # without these three would 404 the row's newest link.
            # purchase.html is in sitemap.xml; the two return pages are
            # deliberately NOT in it and carry noindex,nofollow - they are
            # Stripe checkout round-trip destinations, published only so the
            # checkout has somewhere real to return to.
            'purchase.html'
            'purchase-success.html'
            'purchase-cancelled.html'
            # Detail-page trees. These are directories, not the same thing as
            # archive.html / transmissions.html above; both are needed.
            'archive'
            'transmissions'
            # Assets the pages actually load.
            'assets'
            'css'
            'data'
            'js'
            # Root files served directly.
            'favicon.ico'
            'robots.txt'
            'sitemap.xml'
          )

          for entry in "${PUBLIC[@]}"; do
            if [ ! -e "$entry" ]; then
              echo "::error::Allowlisted path '$entry' is missing from the checkout. Either it was renamed and PUBLIC was not updated, or the checkout is broken. Refusing to publish a partial site."
              exit 1
            fi
            cp -R -- "$entry" _site/
          done

          # assets/reference/ is art-direction source, not a served asset. The
          # one file in it (wordmark-teko-bold-letterpress.png) is the OWNER'S
          # reference image that assets/hero/wordmark-grain.png was extracted
          # from; css/wordmark.css names it in a comment only, never in a url().
          # Checked 12 Aug 2026: no href, src, url() or fetch() anywhere loads
          # it, so dropping it cannot break a page.
          rm -rf _site/assets/reference

          echo "--- published, top level ---"
          find _site -maxdepth 1 -mindepth 1 -print0 | sort -z | tr '\0' '\n'
          echo "--- file count ---"
          find _site -type f | wc -l

      # The allowlist's failure mode is a missing page, not a leak. This step
      # makes that failure mode loud: every root-level .html in the repo must be
      # either published or recognisably internal. A new page that is neither
      # breaks the build here and forces someone to classify it.
      - name: Verify every public page is accounted for
        shell: bash
        run: |
          set -euo pipefail

          # Internal root-level pages, by pattern. 12 Aug 2026 this resolves to
          # 18 files: 13 *-lab.html, links.html, raster-test.html,
          # raster-test-2.html, transmissions-options.html,
          # transmissions-option5-v2.html. 7 public + 18 internal = 25 total.
          is_internal() {
            case "$1" in
              *-lab.html|links.html|raster-test*.html|transmissions-option*.html) return 0 ;;
              *) return 1 ;;
            esac
          }

          UNCLASSIFIED=()
          # -z / read -d '' throughout: root .html names are safe today, but the
          # whole reason this file is being rewritten is a pattern that was
          # safe today and not tomorrow.
          while IFS= read -r -d '' page; do
            [ -e "_site/$page" ] && continue
            is_internal "$page" && continue
            UNCLASSIFIED+=("$page")
          done < <(git ls-files -z -- '*.html' ':(exclude)*/*')

          if [ "${#UNCLASSIFIED[@]}" -gt 0 ]; then
            echo "::error::These root-level pages are neither published nor recognised as internal. Add each to PUBLIC in the assemble step, or to the is_internal pattern list here."
            printf '  %s\n' "${UNCLASSIFIED[@]}"
            exit 1
          fi
          echo "Every root-level .html is either published or explicitly internal."

      # The leak guard. It must NOT be a restatement of the allowlist — that is
      # exactly the mistake the old version made (it checked 'HANDOFF*', the
      # same broken pattern the exclude used, so it agreed with the bug).
      # Here it is written the other way round: it names internal things
      # directly and generously, so it can catch a file that arrives through a
      # route the allowlist never anticipated — e.g. an internal .md dropped
      # into css/, or someone "temporarily" adding '.' to PUBLIC.
      - name: Fail if anything internal slipped through
        shell: bash
        run: |
          set -euo pipefail

          # -iname '*handoff*' deliberately, NOT 'HANDOFF*':
          #   - unanchored, so it matches V2HANDOFF 29.md, and V3HANDOFF, and the
          #     design_handoff_navigator_motion/ directory (tracked as of
          #     12 Aug 2026, and never copied by the allowlist, so this is the
          #     backstop rather than the mechanism that keeps it unpublished);
          #   - case-insensitive, so a lowercase rename does not slip past.
          # This one pattern is the whole fix. Verified 12 Aug 2026 by planting
          # a file literally named 'V2HANDOFF 29.md' in the output directory and
          # confirming this step exits 1.
          #
          # -print0 with `mapfile -d ''`, not $(find): the handoff filenames
          # contain spaces, and a word-split list would both mangle the report
          # and miscount. A guard that breaks on the space is worse than no
          # guard, because it looks like it ran.
          LEAKED=()
          mapfile -d '' LEAKED < <(find _site \( \
            -iname '*handoff*'             -o \
            -iname '*master_prompt*'       -o \
            -name  '*-lab.html'            -o \
            -name  'links.html'            -o \
            -name  'raster-test*'          -o \
            -name  'transmissions-option*' -o \
            -name  '*.md'                  -o \
            -name  '*.py'                  -o \
            -name  '*.mjs'                 -o \
            -name  '*.bat'                 -o \
            -name  '*.sh'                  -o \
            -name  '*.zip'                 -o \
            -name  '.git*'                 -o \
            -name  '.claude'               -o \
            -name  '.mcp.json'             -o \
            -name  'docs'                  -o \
            -name  'design*'               -o \
            -name  'reference'             -o \
            -name  'scripts'               -o \
            -name  'setup'                 \) -print0)

          if [ "${#LEAKED[@]}" -gt 0 ]; then
            echo "::error::Internal files reached the publish directory. Fix the PUBLIC allowlist in the assemble step."
            printf '  %s\n' "${LEAKED[@]}"
            exit 1
          fi

          # A guard that passes on an empty directory is not a guard either.
          if [ ! -s _site/index.html ]; then
            echo "::error::_site/index.html is missing or empty - the assemble step did not produce a site."
            exit 1
          fi
          echo "Clean - nothing internal is being published."

      # Direct upload. `--branch=main` marks this a production deploy on the
      # Pages project (whose production branch is `main`); anything else would
      # land as a preview deployment. wrangler-action pins wrangler itself, and
      # the runner provides Node — the no-Node constraint is the owner's local
      # box, not CI.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=kundalini-spines --branch=main
