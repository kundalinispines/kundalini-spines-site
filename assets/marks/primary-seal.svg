<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kundalini Spines primary seal">
  <!--
    Construction notes (kept here for future editors):
    - Outer ring = the Archive/frame.
    - Two overlapping circles (vesica piscis) = restrained sacred-geometry reference, kept to one motif rather than a dense grid.
    - Center: a 9-segment tapering spine (echoes the 33-vertebra / 7-node language without literally drawing 33, illegible at this scale).
    - Either side of the spine: a diagonal pair reading as "K" (using the spine as its vertical stroke) and a curved stroke reading as "S" — hidden in the geometry rather than spelled out.
  -->
  <g fill="none" stroke="#F2F2EE">
    <!-- outer frame -->
    <circle cx="100" cy="100" r="94" stroke-width="2"/>

    <!-- vesica piscis / sacred geometry, kept subtle -->
    <g stroke-width="1" opacity="0.35">
      <circle cx="82" cy="100" r="46"/>
      <circle cx="118" cy="100" r="46"/>
    </g>

    <!-- hidden K: two diagonals meeting the spine's left edge -->
    <g stroke-width="3.5" stroke-linecap="round">
      <path d="M88,100 L58,64"/>
      <path d="M88,100 L58,136"/>
    </g>

    <!-- hidden S: a single curved stroke to the right of the spine -->
    <path d="M142,64 C118,74 118,90 132,100 C146,110 146,126 122,136" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- central spine: 9 tapering segments -->
  <g fill="#F2F2EE">
    <rect x="92" y="46"  width="16" height="10"   rx="4"/>
    <rect x="91" y="57.5" width="18" height="10"   rx="4"/>
    <rect x="90" y="69"  width="20" height="10.5" rx="4.2"/>
    <rect x="89" y="80.5" width="22" height="10.5" rx="4.2"/>
    <rect x="88" y="92"  width="24" height="11"   rx="4.4"/>
    <rect x="87" y="103.5" width="26" height="11"  rx="4.4"/>
    <rect x="86" y="115" width="28" height="11"   rx="4.4"/>
    <rect x="85" y="126.5" width="30" height="11.5" rx="4.6"/>
    <rect x="84" y="138" width="32" height="12"   rx="4.8"/>
  </g>
</svg>
