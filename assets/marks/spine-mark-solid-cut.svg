<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kundalini Spines spine mark, solid">
  <!--
    SOLID CUT of the primary mark — same seven vertebrae, same silhouette, but
    filled instead of stroked so nothing lands sub-pixel. New Aug 12 2026,
    supplied with the mark it accompanies. Use this wherever the mark renders
    below 24px: nav, footers, favicons, anywhere it sits beside body text.

    IT FIXES THE STRUCTURE, NOT THE WEIGHT — measured Aug 12 2026, and worth
    knowing before anyone reaches for it as a rescue at 16px. Rasterised on
    transparent and sampled for alpha:

              16px            18px            32px            48px
      solid   peak 0.38       0.49            0.59            0.70
      hairline peak 0.44      0.46            0.54            0.60
      the mark this replaced  0.60 / 0.66 / 0.69 / 0.77

    The bodies read cleanly at every size; the transverse processes are 3.4
    units tall, which is 0.54px at 16 and 0.61px at 18, so THEY are what greys
    out. At 16px this reads as a textured stripe rather than as a spine. The old
    seven-bar mark was stronger there because it had no processes to lose.
    If a true micro cut is ever wanted it needs the processes thickened, not
    this file scaled down.
  -->
  <g fill="#F2F2EE">
    <rect x="42.5" y="5.8" width="15" height="8.5"></rect>
    <rect x="57.5" y="8.4" width="5.5" height="3.4"></rect>
    <rect x="37.0" y="8.4" width="5.5" height="3.4"></rect>
    <rect x="42.5" y="18.8" width="15" height="8.5"></rect>
    <rect x="57.5" y="21.4" width="9" height="3.4"></rect>
    <rect x="33.5" y="21.4" width="9" height="3.4"></rect>
    <rect x="42.5" y="31.8" width="15" height="8.5"></rect>
    <rect x="57.5" y="34.4" width="12" height="3.4"></rect>
    <rect x="30.5" y="34.4" width="12" height="3.4"></rect>
    <rect x="42.5" y="44.8" width="15" height="8.5"></rect>
    <rect x="57.5" y="47.4" width="13.5" height="3.4"></rect>
    <rect x="29.0" y="47.4" width="13.5" height="3.4"></rect>
    <rect x="42.5" y="57.8" width="15" height="8.5"></rect>
    <rect x="57.5" y="60.4" width="12" height="3.4"></rect>
    <rect x="30.5" y="60.4" width="12" height="3.4"></rect>
    <rect x="42.5" y="70.8" width="15" height="8.5"></rect>
    <rect x="57.5" y="73.4" width="9" height="3.4"></rect>
    <rect x="33.5" y="73.4" width="9" height="3.4"></rect>
    <rect x="42.5" y="83.8" width="15" height="8.5"></rect>
    <rect x="57.5" y="86.4" width="6.5" height="3.4"></rect>
    <rect x="36.0" y="86.4" width="6.5" height="3.4"></rect>
  </g>
</svg>
