<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kundalini Spines spine mark">
  <!--
    PRIMARY SPINE MARK — front view, seven vertebrae, uniform hairline.
    Replaced Aug 12 2026 (owner-supplied). The mark it replaces was seven
    rounded bars tapering downward; this one is anatomical — vertebral bodies
    with transverse processes, widest at the middle of the column, which is the
    same read as the site's own wireframe spine (assets/hero/spine-ui-wire.png)
    rather than a separate abstraction of it.

    THIS CUT IS FOR LARGE SIZES. stroke-width 2.4 on a 100-unit viewBox is
    2.4% of the rendered box, so it lands sub-pixel wherever the mark is small:
    0.38px at 16, 0.43px at 18, 0.77px at 32. Measured on a transparent
    raster, the brightest pixels in this cut only reach alpha 0.44 at 16px and
    0.60 at 48px — it never puts down solid ink at UI scale. Use
    spine-mark-solid-cut.svg below 24px; see the note in that file.
  -->
  <g fill="none" stroke="#F2F2EE" stroke-width="2.4" stroke-linejoin="miter">
    <rect x="42.5" y="5.8" width="15" height="8.5"></rect>
    <path d="M57.5 7.8 L63.0 12.8 L61.5 14.3 L57.5 11.6 Z"></path>
