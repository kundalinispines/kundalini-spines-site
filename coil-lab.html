<!DOCTYPE html>
<!-- ==========================================================================
     COIL LAB — the twin serpents on the wire spine, on the site's own sky.

     WHAT THIS IS FOR: judging the feel of the coil, nothing else. There is no
     scroll here and no video. The cue is a ONE-SHOT — press Replay and it runs
     once up the column, holds at the crown, and dissipates. That is the whole
     interaction, deliberately: the thing being judged is a single event, so
     anything that lets you scrub it would let you judge it as something it is
     not going to be.

     The artwork is assets/hero/spine-ui-wire.png. spine-aster.svg, which the
     coil was originally shaped to, is retired.

     Sliders: turns, beam, hug are the three the owner asked for. Split, clear,
     far and duration are here because the two fixes this pass made — telling
     the strands apart, and getting the far half to read — are both judgement
     calls that deserve a dial rather than a constant.

     RELATED FILES, DO NOT EDIT FROM HERE: hero-scrub-lab.html (where the coil
     came from) and spine-lab.html (the navigator) are owned elsewhere.
     ========================================================================== -->
<html lang="en" class="page-home">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coil Lab · Kundalini Spines</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/star-bg.css">

<style>
:root {
  /* star-bg.css reads the kick/snare envelope; with nothing driving it here,
     every consumer resolves to 0 and the sky computes its rest state. */
  --kick: 0; --snare: 0; --charge: 0;
  --kick-stars: 0; --kick-cloud: 0; --snare-bolt: 0;

  --spine-h:        86vh;
  --wire-opacity:   0.64;   /* matches spine-lab's --spine-anat-opacity */
  --wire-bright:    0.9;
  --wire-contrast:  0.7;

  /* ---- the coil. js/spine-coil.js reads these ONCE at init and again on
     every slider input — never per frame. Amber is quoted verbatim from the
     navigator's --node-color in spine-lab.html so the two systems speak the
     same language; do not drift it. */
  --coil-color:    240, 165, 92;
  --coil-color-b:  255, 236, 208;  /* the second strand's tone at split 1 */
  --coil-split:    0.58;    /* how far apart the two strands are told */
  --coil-turns:    3.5;      /* per strand, base to crown */
  --coil-beam:     0.12;    /* the lit central channel and its reach */
  --coil-hug:      1;      /* 1 = follow the measured silhouette, 0 = constant */
  --coil-clear:    3;     /* viewBox units of air between bone and coil */
  --coil-far:      0.64;      /* presence of the half that passes behind the bone */
  --coil-blend:    0.35;   /* width of the front/back crossover blend, in sin(theta).
                              0 = the original hard split. Safe up to ~0.6; past that
                              the back canvas starts painting where the bone covers it. */
  --coil-ms:       900;   /* length of the one shot */
}

body { margin: 0; min-height: 100vh; }

.stage {
  position: relative; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}

/* The artwork box is the coil's coordinate system: 1200x2150, the wire PNG's
   own pixel box, so the module's measured viewBox units land exactly on the
   drawing with no correction anywhere. */
.spine {
  position: relative; height: var(--spine-h); aspect-ratio: 1200 / 2150;
}
.spine__wire {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  opacity: var(--wire-opacity);
  filter: brightness(var(--wire-bright)) contrast(var(--wire-contrast));
}

/* TWO canvases, and their order in the markup is load-bearing.
   --back sits BEFORE the wire so the far half of each strand passes behind the
   column; --front sits AFTER it so the near half passes in front. That depth
   split is the entire illusion of winding AROUND rather than lying ON. One
   canvas cannot do it.

   width/height 100% are REQUIRED, not belt-and-braces. A canvas is a replaced
   element, so `inset: 0` with auto width resolves to its INTRINSIC size (the
   width/height content attributes, default 300x150) rather than stretching to
   the containing block the way a div does — and since the script sizes the
   backing store from the measured box, the element feeds its own measurement
   back into itself and the height runs away. Measured at 300x754 against an
   artwork box of 345.6x619.2 before this line existed. */
.coil {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none;
}

/* ------------------------------------------------------------------- the HUD */
.hud {
  position: fixed; left: 16px; bottom: 16px; z-index: 40;
  width: 300px; max-height: calc(100vh - 32px); overflow-y: auto;
  padding: 14px 16px 16px;
  background: rgba(8, 9, 12, 0.82);
  border: 1px solid rgba(216, 208, 190, 0.18);
  border-radius: 4px;
  backdrop-filter: blur(8px);
  font-family: var(--font-mono, "IBM Plex Mono", monospace);
  font-size: 11px; line-height: 1.5; color: rgba(216, 208, 190, 0.86);
}
.hud.is-hidden > *:not(.hud__bar) { display: none; }
.hud__bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hud__title { letter-spacing: 0.18em; text-transform: uppercase; font-size: 10px; color: rgba(216, 208, 190, 0.55); }
.hud__row { margin-top: 12px; }
.hud__row label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
.hud__row label b { font-weight: 500; color: rgb(240, 165, 92); }
.hud__row input[type=range] { width: 100%; accent-color: rgb(240, 165, 92); }
.hud__note { margin: 10px 0 0; font-size: 10px; line-height: 1.5; color: rgba(216, 208, 190, 0.5); }
.hud__facts { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(216, 208, 190, 0.14); font-size: 10px; }
.hud__facts div { display: flex; justify-content: space-between; gap: 8px; }
.hud__facts b { font-weight: 500; color: rgba(216, 208, 190, 0.9); }
.hud__facts .bad b { color: rgb(228, 106, 92); }
.btn {
  font-family: inherit; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 6px 12px; cursor: pointer;
  background: rgba(240, 165, 92, 0.14); color: rgb(240, 165, 92);
  border: 1px solid rgba(240, 165, 92, 0.42); border-radius: 3px;
}
.btn:hover { background: rgba(240, 165, 92, 0.24); }
.btn--ghost { background: transparent; color: rgba(216, 208, 190, 0.7); border-color: rgba(216, 208, 190, 0.28); }

@media (prefers-reduced-motion: reduce) {
  .coil { display: none; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="spine" id="spine">
    <!-- ORDER IS LOAD-BEARING: back canvas, then the artwork, then front canvas.
         See the .coil comment in the stylesheet. -->
    <canvas class="coil coil--back" id="coilBack" aria-hidden="true"></canvas>
    <img class="spine__wire" src="assets/hero/spine-ui-wire.png" alt="" decoding="async">
    <canvas class="coil coil--front" id="coilFront" aria-hidden="true"></canvas>
  </div>
</div>

<div class="hud" id="hud">
  <div class="hud__bar">
    <span class="hud__title">Coil</span>
    <span>
      <button type="button" class="btn" id="replay">Replay</button>
      <button type="button" class="btn btn--ghost" id="toggle">Hide</button>
    </span>
  </div>

  <div class="hud__row"><label>Turns <b id="vTurns">3.5</b></label>
    <input type="range" id="sTurns" min="1" max="10" step="0.5" value="3.5"></div>
  <div class="hud__row"><label>Beam <b id="vBeam">0.12</b></label>
    <input type="range" id="sBeam" min="0" max="1" step="0.02" value="0.12"></div>
  <div class="hud__row"><label>Hug <b id="vHug">1.00</b></label>
    <input type="range" id="sHug" min="0" max="1" step="0.02" value="1"></div>
  <div class="hud__row"><label>Split <b id="vSplit">0.58</b></label>
    <input type="range" id="sSplit" min="0" max="1" step="0.02" value="0.58"></div>
  <div class="hud__row"><label>Clearance <b id="vClear">3</b></label>
    <input type="range" id="sClear" min="0" max="40" step="1" value="3"></div>
  <div class="hud__row"><label>Far half <b id="vFar">0.64</b></label>
    <input type="range" id="sFar" min="0" max="1.6" step="0.02" value="0.64"></div>
  <div class="hud__row"><label>Crossover blend <b id="vBlend">0.35</b></label>
    <input type="range" id="sBlend" min="0" max="0.6" step="0.01" value="0.35"></div>
  <div class="hud__row"><label>Duration <b id="vMs">900</b>ms</label>
    <input type="range" id="sMs" min="900" max="6000" step="100" value="900"></div>

  <div class="hud__facts" id="facts"></div>
  <p class="hud__note">
    Hug 1 follows the wire's measured silhouette; hug 0 is a constant-radius
    cylinder. Split tells the two strands apart by tone and weight — at 0 they
    are identical and read as one coil at double frequency. Far half is the
    presence of the half that passes behind the bone.
  </p>
</div>

<script src="js/spine-coil.js"></script>
<script>
(function () {
  'use strict';
  var root = document.documentElement;
  var coil = SpineCoil.create({
    back:  document.getElementById('coilBack'),
    front: document.getElementById('coilFront'),
    config: SpineCoil.readCssVars(root)
  });

  /* ------------------------------------------------------------------ facts
     The numbers this page exists to check, printed rather than eyeballed:
     how far the coil gets from the axis against the widest thing in the
     artwork, and how flat the ellipse ever gets. The second one has a history —
     with the eye at mid-screen the minor axis passes through ZERO as the
     wavefront crosses centre and every ring collapses to a horizontal line.
     0.212 is the measured safe minimum. */
  var facts = document.getElementById('facts');
  function showFacts() {
    var m = coil.metrics();
    var flat = m.minRatio < 0.211;
    facts.innerHTML =
      '<div><span>max half-extent</span><b>' + m.maxExtent.toFixed(1) + ' @ y' + m.maxExtentAtY + '</b></div>' +
      '<div><span>art halfwidth</span><b>' + m.artMaxHalfwidth.toFixed(1) + '</b></div>' +
      '<div><span>clearance there</span><b>' + m.clearanceAtWidest.toFixed(1) + '</b></div>' +
      '<div' + (flat ? ' class="bad"' : '') + '><span>min minor/major</span><b>' +
        m.minRatio.toFixed(4) + ' @ y' + m.minRatioAtY + '</b></div>';
  }

  /* ---------------------------------------------------------------- sliders
     Each slider writes its CSS variable and then asks the module to re-read.
     The variables stay the source of truth so anything tuned here can be
     copied straight into a stylesheet, and the read happens on INPUT, never
     per frame — getComputedStyle in a draw loop is a style flush every frame
     for a value only a human changes. */
  var SLIDERS = [
    { id: 'Turns', v: '--coil-turns', fix: 1 },
    { id: 'Beam',  v: '--coil-beam',  fix: 2 },
    { id: 'Hug',   v: '--coil-hug',   fix: 2 },
    { id: 'Split', v: '--coil-split', fix: 2 },
    { id: 'Clear', v: '--coil-clear', fix: 0 },
    { id: 'Far',   v: '--coil-far',   fix: 2 },
    { id: 'Blend', v: '--coil-blend', fix: 2 },
    { id: 'Ms',    v: '--coil-ms',    fix: 0 }
  ];
  SLIDERS.forEach(function (s) {
    var el = document.getElementById('s' + s.id), out = document.getElementById('v' + s.id);
    el.addEventListener('input', function () {
      root.style.setProperty(s.v, el.value);
      out.textContent = parseFloat(el.value).toFixed(s.fix);
      coil.setConfig(SpineCoil.readCssVars(root));
      showFacts();
      /* redraw whatever is on screen so a slider is judged where you left it */
      if (!coil.running()) coil.seek(coil.progress() || 0.66);
    });
  });

  document.getElementById('replay').addEventListener('click', function () { coil.run(); });
  var hud = document.getElementById('hud'), tog = document.getElementById('toggle');
  tog.addEventListener('click', function () {
    hud.classList.toggle('is-hidden');
    tog.textContent = hud.classList.contains('is-hidden') ? 'Show' : 'Hide';
  });
  addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') coil.run();
  });

  /* The artwork is sized in vh, so it changes on any viewport resize AND on a
     mobile URL bar showing or hiding. Redraw the parked frame when it does. */
  addEventListener('resize', function () {
    if (!coil.running()) coil.seek(coil.progress());
  });

  showFacts();

  /* Fire once on load, the way it will fire on the real page. Waiting for the
     artwork means the first frame is never drawn against an empty box. */
  var img = document.querySelector('.spine__wire');
  function start() { coil.run(); }
  if (img.complete) requestAnimationFrame(start);
  else img.addEventListener('load', function () { requestAnimationFrame(start); });

  /* A console handle, same shape as spine-lab's __spineLab: drive it from a
     test without waiting on the frame loop. seek() parks one exact frame,
     which is what screenshots need. */
  window.__coilLab = {
    coil: coil,
    run: function () { coil.run(); },
    seek: function (p) { coil.seek(p); },
    metrics: function () { return coil.metrics(); },
    config: function () { return coil.config(); }
  };
})();
</script>
</body>
</html>
