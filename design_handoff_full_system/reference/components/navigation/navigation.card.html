</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.KundaliniSpinesDesignSystem_22e3e6;

const { Nav, SiteFooter, FilterChip } = NS;
const items = [{label:'Home',href:'/'},{label:'Music',href:'/#tracks'},{label:'Transmissions',href:'t'},{label:'Archive',href:'a'},{label:'About',href:'b'}];
function Demo() {
  const [f, setF] = React.useState('All');
  return (
    <div className="stack">
      <div style={{position:'relative',height:'64px',border:'1px solid var(--color-gray-700)'}}>
        <Nav items={items} current="/" scrolled />
      </div>
      <div className="row">
        {['All','Artwork','Artifacts','Lyrics','Videos'].map(c => <FilterChip key={c} active={f===c} onClick={()=>setF(c)}>{c}</FilterChip>)}
      </div>
      <SiteFooter
        blurb="Knowledge hidden in plain sight. Two Messengers, one signal."
        columns={[
          { head:'Kundalini Spines' },
          { head:'Navigate', rows:[{label:'Music',href:'#'},{label:'Transmissions',href:'#'},{label:'Archive',href:'#'},{label:'About',href:'#'}] },
          { head:'Channels', rows:[{label:'Instagram',href:'#'},{label:'X',href:'#'},{label:'YouTube',href:'#'},{label:'TikTok'},{label:'Spotify'}] },
          { head:'Signal', rows:[{label:'Newsletter',href:'#'},{label:'Contact',href:'#'}] }
        ]} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
