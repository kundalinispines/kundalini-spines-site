<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--color-black);padding:20px;font-family:var(--font-body)}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.stack{display:flex;flex-direction:column;gap:18px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.KundaliniSpinesDesignSystem_22e3e6;

const { SpineRail, SpineNode, SpineCard, SpineHint } = NS;
function Demo() {
  const [active, setActive] = React.useState('Transmissions');
  const nodes = [
    { label:'Our Story', y:'14%', side:'right', kind:'card' },
    { label:'Music', y:'34%', side:'left', kind:'immersive' },
    { label:'Transmissions', y:'54%', side:'right', kind:'card' },
    { label:'Archive', y:'74%', side:'left', kind:'immersive' }
  ];
  return (
    <div style={{position:'relative',height:'380px',background:'radial-gradient(120% 90% at 50% 40%, #0d1018, #03040F 70%)',border:'1px solid var(--color-gray-700)',overflow:'hidden'}}>
      <SpineRail wireSrc="../../assets/hero/spine-ui-wire.webp" markers={false} points={['22%','44%','64%','86%']}>
        {nodes.map(n => <SpineNode key={n.label} {...n} state={active===n.label?'active':'idle'} onClick={()=>setActive(n.label)} />)}
      </SpineRail>
      <div style={{position:'absolute',right:'20px',top:'24px',zIndex:25}}>
        <SpineCard index={3} total={6} side="right" eyebrow="Transmissions" title="Tune to a frequency" cta="Open the terminal" style={{width:'260px'}}>
          <p style={{margin:0}}>Every signal the Messengers put out arrives here, timestamped and numbered.</p>
        </SpineCard>
      </div>
      <SpineHint align="left">Click to open</SpineHint>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
