<!doctype html>
<html lang="en" class="page-entrance">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrance — Spine UI V2</title>

<!-- ==========================================================================
     ENTRANCE — the whole sequence, assembled.

       1. the hero video FREE-PLAYS 0 -> 8.768s, muted, autoplaying
       2. "KUNDALINI SPINES" is the headline while it plays
       3. the clip ends on the nebula; the video settles onto the site's own
          star field, which is very nearly the same picture
       4. "Knowledge Hidden in Plain Sight" shutter-reveals
       5. a small amber ENTER appears beneath it
       6. ENTER hands off to the navigator, and the twin serpents run once

     THERE IS NO SCROLL ANYWHERE IN THIS PAGE. The scroll-scrubbed entrance in
     hero-scrub-lab.html was abandoned Aug 10 2026, along with the spine aster,
     its mask wipe and the dust handoff. That file is kept as a record; nothing
     here is derived from it.

     WHAT THIS FILE OWNS: the sequence, and nothing else. The navigator is
     css/spine-ui.css + js/spine-ui.js, the serpents are js/spine-coil.js, the
     reveal is js/shutter-text.js + css/shutter-text.css. If something here
     looks like it is reimplementing one of those, it is a bug.

     WHY THE VIDEO AND THE NAVIGATOR SHARE ONE PAGE: the clip's last frame is a
     nebula on black and so is css/star-bg.css, so the handover between them is
     invisible. Navigating to a second URL would repaint that background and
     put a seam in the one place the design cannot afford one.
     ========================================================================== -->

<!-- THIS PAGE LINKED NO WEBFONT UNTIL Aug 10 2026, AND NOTHING SAID SO.

     Measured: '800 56px "Big Shoulders Display"' rendered "KUNDALINI SPINES" at
     536.79px here — byte-identical to a deliberately nonsense family — against
     351.01px on shutter-lab.html, which does link Google Fonts. document.fonts
     .size was 0. So every headline on this page was browser fallback, 53% wider
     than the intended face, and document.fonts.check() answered TRUE throughout;
     it is not a usable probe. Width against a nonsense family is.

     It also means css/shutter-text.css's slat grid — derived from measured type
     metrics, with its own comment warning that fallback metrics "misplace every
     boundary, silently" — was being computed against the wrong face the entire
     time the reveal was being judged.

     Archivo is requested on BOTH axes: wdth 62 is its narrowest cut and the
     reason it was chosen over Anton for the wordmark. Asking for wght alone
     silently returns the normal width. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62,900&family=Teko:wght@600;700&family=Big+Shoulders+Display:wght@700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- REAL identity + REAL atmosphere, reused unchanged. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/star-bg.css">
<link rel="stylesheet" href="css/spine-ui.css">
<link rel="stylesheet" href="css/shutter-text.css">
<link rel="stylesheet" href="css/text-scramble.css">
<link rel="stylesheet" href="css/wordmark.css">

<style>
:root {
  /* Idle the reactive sky: with no audio engine on this page the kick/snare
     consumers resolve to 0 and star-bg.css computes its rest state.

     DELIBERATE, and it is the whole answer to "what is the sky doing during
     the entrance": nothing. It stays still until Music is opened, which is
     what makes Music the moment the site comes alive. When js/spine-bg.js is
     eventually attached here these zeroes must come OUT — the detector writes
     the same variables inline and a page that ships zeroes as its authored
     defaults has simply pinned the sky to rest. */
  --kick: 0; --snare: 0; --charge: 0;
  --kick-stars: 0; --kick-cloud: 0; --snare-bolt: 0;

  --ent-settle-ms: 620ms;   /* video -> star field. Long, because it is a
                               cross-fade between two near-identical images and
                               a fast one reads as a flicker rather than a fade. */
  --ent-cut-ms:    200ms;   /* the same fade when a seek was not possible —
                               see canSeek() below */
  --ent-hand-ms:   520ms;   /* entrance layer -> navigator */
}

html, body { height: 100%; }
body { margin: 0; overflow: hidden; }   /* nothing on this page scrolls, ever */

/* --------------------------------------------------------------------------
   THE ENTRANCE LAYER
   -------------------------------------------------------------------------- */
.ent {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  transition: opacity var(--ent-hand-ms) var(--ease-standard);
}
.ent.is-gone { opacity: 0; pointer-events: none; }

.ent__video {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  transition: opacity var(--ent-settle-ms) linear;
}
/* The video is REMOVED from the compositor once it has faded, not merely made
   transparent. A 1920x1080 decoded surface left composited over the navigator
   costs a full-screen layer for the rest of the session. */
.ent.is-settled .ent__video { opacity: 0; }
.ent.is-cut     .ent__video { transition-duration: var(--ent-cut-ms); opacity: 0; }
.ent__video.is-dropped { display: none; }

/* Just enough scrim to hold the type over the brightest part of the clip.
   It fades with the video: once the star field is showing there is nothing to
   protect the type from. */
.ent__scrim {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center,
              rgba(8,9,12,0.52) 0%, rgba(8,9,12,0.30) 45%, rgba(8,9,12,0.62) 100%);
  transition: opacity var(--ent-settle-ms) linear;
}
.ent.is-settled .ent__scrim, .ent.is-cut .ent__scrim { opacity: 0; }

.ent__copy { position: relative; z-index: 2; text-align: center; padding: 0 var(--space-24, 24px); }

/* .scrub__title is NOT in any shared stylesheet — it is declared inline in both
   hero-scrub-lab.html and shutter-lab.html, so a page that copies the markup
   without it silently gets base.css's h1 instead. Caught here by looking at a
   capture and finding the wrong face. Quoted from shutter-lab.html so the
   headline being revealed is the same object that was judged against the
   reference frames.

   The element keeps .text-stencil for its text-shadow while this rule
   overrides the stencil FAMILY, which is deliberate: stencil bridges are
   horizontal gaps through the glyphs, and slicing horizontal slats across them
   puts two competing horizontal rhythms on the same letterforms — the word
   stops being readable mid-run. If the hero ever goes truly stencil, the band
   count has to come down and be re-judged against the bridges.

   Bone rather than --text-primary: bone is what the amber ghost resolves INTO.
   On signal white the amber reads as a stain the letters shake off; on bone it
   reads as the same light cooling. */
.ent__copy .scrub__title {
  font-family: var(--font-display); font-weight: 800; font-size: var(--fs-h1);
  line-height: var(--lh-heading); letter-spacing: var(--tracking-display);
  color: var(--color-bone);
  margin: 0;
}

/* Both occupy the same cell, so one can replace the other in place. */
.ent__stack { display: grid; place-items: center; }
.ent__stack > * { grid-area: 1 / 1; }

/* KUNDALINI SPINES IS THE HEADLINE WHILE THE CLIP PLAYS. The whole point of the
   sequence is that the sentence is not on screen yet: it arrives, and it can
   only arrive if there was something else there first.

   It is now the two-line lockup in css/wordmark.css — a compressed poster
   gothic (Archivo 900 at width 62) with a registration rule between the lines
   and a letterpress grain that doubles as its reveal. The single tracked-out
   .sh-eyebrow line it replaced is gone.

   THE LOCKUP IS NO LONGER IN .ent__stack, and that reverses an earlier
   decision, so here is why. The stack existed to cross-fade the eyebrow and the
   headline IN PLACE, one slot two occupants. That was right when both were
   centred single-ish lines. It is not right now, because the two have different
   constraints:

     - the LOCKUP shares the screen with the messengers, who walk toward camera
       for the clip's first ~4.2s with their heads in y 115..355 (sampled every
       200ms at 1440x900). Centred, it lands across both faces. It has to sit
       low.
     - the HEADLINE arrives after the video has gone. There is nothing to clear,
       and low would just be bottom-heavy over an empty star field.

   So the lockup is absolutely positioned near the bottom by css/wordmark.css
   and the stack keeps the headline alone. The cross-fade is still in place in
   the sense that matters — the lockup fades out exactly as the headline fades
   in — but they no longer occupy one cell. */

/* THE HEADLINE DOES NOT EXIST UNTIL THE REVEAL.

   visibility, not opacity or display: the shutter driver owns opacity on this
   element and its slats, so setting opacity here would fight it; display:none
   would stop the type being laid out, and the slat grid is measured from the
   rendered box. visibility:hidden keeps the box, keeps the metrics, and paints
   nothing. */
.ent .shutter { visibility: hidden; }
.ent.is-settled .shutter,
.ent.is-cut .shutter { visibility: visible; }

/* The old subtitle is deliberately gone. It read "Two Messengers. One Signal.
   Scroll to run the transmission." and there is no scroll on this page any
   more; leaving it would instruct the reader to do the one thing that does
   nothing. The eyebrow and the headline carry the moment on their own. */

/* ENTER — the only door. It does not exist until the reveal has finished,
   because a door offered before the sentence has landed pulls the eye off the
   sentence. */
.ent__enter {
  display: inline-flex; align-items: center; gap: 10px;
  margin-top: var(--space-32, 32px);
  padding: 12px 26px;
  min-height: 44px;                      /* a real tap target at 375px */
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgb(var(--node-color));
  background: transparent;
  border: 1px solid rgba(var(--node-color), 0.45);
  border-radius: 2px;
  cursor: pointer;
  opacity: 0; transform: translateY(6px);
  pointer-events: none;
  transition: opacity 420ms var(--ease-standard),
              transform 420ms var(--ease-standard),
              border-color 200ms linear, box-shadow 200ms linear;
  box-shadow: 0 0 0 rgba(var(--node-color), 0);
}
.ent.is-open .ent__enter { opacity: 1; transform: none; pointer-events: auto; }
.ent__enter:hover, .ent__enter:focus-visible {
  border-color: rgba(var(--node-color), 0.9);
  box-shadow: 0 0 18px rgba(var(--node-color), 0.25);
}
.ent__enter .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgb(var(--node-color));
  box-shadow: 0 0 10px rgba(var(--node-color), 0.9);
}

/* SKIP — deliberately quiet and always present during playback. Enter and the
   wheel do the same thing; the button exists because neither of those is
   discoverable, and on a phone neither exists at all. */
.ent__skip {
  position: absolute; right: 18px; bottom: 16px; z-index: 3;
  padding: 10px 14px; min-height: 44px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(216,208,190,0.55);
  background: transparent; border: 1px solid rgba(216,208,190,0.2);
  border-radius: 2px; cursor: pointer;
  transition: opacity 260ms linear, color 200ms linear, border-color 200ms linear;
}
.ent__skip:hover, .ent__skip:focus-visible { color: var(--color-bone); border-color: rgba(216,208,190,0.5); }
.ent.is-settled .ent__skip, .ent.is-cut .ent__skip { opacity: 0; pointer-events: none; }

/* --------------------------------------------------------------------------
   THE NAVIGATOR, and the serpents that run over it
   -------------------------------------------------------------------------- */
.spine-stage {
  opacity: 0;
  transition: opacity var(--ent-hand-ms) var(--ease-standard);
}
.spine-stage.is-live { opacity: 1; }

/* THE COIL'S COORDINATE SPACE IS NOT THE NAVIGATOR'S SPINE BOX.

   js/spine-coil.js maps art coordinates from a 1200x2150 viewBox onto its
   canvas, so its canvas must cover the WHOLE PNG the way coil-lab.html's
   aspect-ratio box does. The navigator does not show the whole PNG: its
   .spine__anat is a narrow strip (--spine-anat-w, 240..380px) painting the
   image at `background-size: auto 100%` with overflow:hidden, so the file is
   height-fitted and then cropped left and right.

   So the canvases get their own box that reproduces the full-PNG rectangle —
   same height as .spine__anat, width from the 1200/2150 aspect — inside a
   wrapper carrying the SAME crop. Drop the canvases straight into .spine and
   the serpents wind around a column that is not where they think it is.

   They also cannot go INSIDE .spine__anat: it carries the spine-breathe scaleY
   animation and a brightness/contrast filter, and both would inherit onto the
   canvas and distort the coil. Measured Aug 10 2026 while assembling this. */
.ent-coil {
  position: absolute; top: 5%; bottom: 5%; left: 50%;
  width: var(--spine-anat-w); transform: translateX(-50%);
  overflow: hidden;                 /* the same crop .spine__anat applies */
  pointer-events: none;
}
.ent-coil--back  { z-index: 1; }    /* behind the wireframe */
.ent-coil--front { z-index: 3; }    /* in front of it */

/* Paint order is what the depth split needs, and z-index is what provides it
   here — the module's "markup order is load-bearing" note is really about
   which canvas paints first. */
.ent-coil__box {
  position: absolute; top: 0; left: 50%; height: 100%;
  aspect-ratio: 1200 / 2150; transform: translateX(-50%);
}
/* width/height 100% is NOT belt-and-braces: a canvas is a replaced element, so
   auto width resolves to the intrinsic 300x150 and the module, which sizes its
   backing store from the measured box, then feeds that measurement back into
   itself. */
.ent-coil__box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.spine__anat { z-index: 2; }

@media (prefers-reduced-motion: reduce) {
  .ent-coil { display: none; }
  .ent__video { transition-duration: 1ms; }
}

/* --------------------------------------------------------------------------
   THE WORDMARK TUNE PANEL — only present with ?tune on the URL.

   Same construction as spine-lab.html's panel, and for the same reason: the
   position of the lockup depends on what is BEHIND it at any given moment, and
   the thing behind it moves for 8.7 seconds. Three rounds of me picking a
   number, capturing it and asking is slower and worse than one round of the
   owner dragging it while scrubbing the clip underneath.

   The video scrub is the field that makes the rest usable — position judged
   against frame 0 alone is position judged against a sixth of the problem.

   NOT accent-color, matching spine-lab.html: the track and thumb are rebuilt
   below for a 1px bone hairline, and accent-color is dead CSS once
   appearance:none is set. The other labs use accent-color precisely because
   they DON'T rebuild the track.
   -------------------------------------------------------------------------- */
.wtune {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 200;
  width: 310px; max-width: 92vw;
  display: flex; flex-direction: column;
  background: rgba(8,9,12,0.92); border-left: 1px solid rgba(216,208,190,0.16);
  backdrop-filter: blur(8px);
  font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary);
  transition: transform 260ms var(--ease-standard);
}
.wtune.is-collapsed { transform: translateX(100%); }
.wtune__head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 12px 14px; border-bottom: 1px solid rgba(216,208,190,0.16); flex: 0 0 auto;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-primary);
}
.wtune__body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 10px 14px 20px; }
.wtune__foot {
  flex: 0 0 auto; display: flex; gap: 6px; flex-wrap: wrap;
  padding: 10px 14px; border-top: 1px solid rgba(216,208,190,0.16);
  background: rgba(5,5,5,0.5);
}
.wtune-tab {
  position: fixed; top: 50%; right: 0; z-index: 201; transform: translateY(-50%);
  padding: 12px 7px; writing-mode: vertical-rl;
  background: rgba(8,9,12,0.9); border: 1px solid rgba(216,208,190,0.22); border-right: 0;
  color: var(--color-bone); font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer;
  opacity: 0; pointer-events: none; transition: opacity 200ms var(--ease-standard);
}
.wtune-tab.is-shown { opacity: 1; pointer-events: auto; }

.wfld { margin-bottom: 13px; }
.wfld__top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.wfld__val { color: var(--text-primary); font-variant-numeric: tabular-nums; }
.wfld.is-dirty .wfld__lab { color: rgb(240,165,92); }
.wfld__tip { display: block; color: var(--color-gray-500); font-size: 10px; margin-top: 2px; line-height: 1.45; }
.wfld input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 14px; margin: 5px 0 0; background: transparent; cursor: ew-resize;
}
.wfld input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: rgba(216,208,190,0.34); }
.wfld input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; margin-top: -5px;
  width: 11px; height: 11px; border-radius: 50%; background: var(--color-bone); border: 0;
}
.wfld input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(240,165,92,0.45); }
.wtune-btn {
  flex: 1 1 auto; padding: 7px 9px; cursor: pointer;
  background: transparent; border: 1px solid rgba(216,208,190,0.34);
  color: var(--text-secondary); font-family: inherit; font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase;
}
.wtune-btn:hover { color: var(--text-primary); border-color: var(--color-bone); }
.wtune-out {
  width: 100%; height: 120px; margin-top: 8px; display: none;
  background: rgba(5,5,5,0.7); border: 1px solid rgba(216,208,190,0.24);
  color: var(--text-secondary); font-family: inherit; font-size: 10px; line-height: 1.5;
  padding: 7px; resize: vertical; white-space: pre;
}
.wtune-out.is-shown { display: block; }
.wtune-sec {
  margin: 16px 0 9px; padding-top: 12px; border-top: 1px solid rgba(216,208,190,0.12);
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-bone);
}
.wtune-sec:first-child { margin-top: 0; padding-top: 0; border-top: 0; }

/* Phone: the headline is already handled by css/shutter-text.css (its grid is
   derived from measured type metrics, not fixed px). This is only about the
   furniture. */
@media (max-width: 600px) {
  .ent__skip { right: 12px; bottom: 12px; }
  .ent__enter { margin-top: var(--space-24, 24px); }
}
</style>
</head>
<body>

<!-- The directional-blur ladder the shutter points at, rung by rung.
     stdDeviation is not CSS-settable, so it cannot be animated from a custom
     property; the driver swaps which filter each copy uses.
     color-interpolation-filters="sRGB" is load-bearing — the SVG default is
     linearRGB, which shifts the amber as it blurs. -->
<svg class="sh-filters" aria-hidden="true" focusable="false">
  <defs>
    <filter id="shBlur1"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1 0"/></filter>
    <filter id="shBlur2"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="2 0"/></filter>
    <filter id="shBlur3"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3 0"/></filter>
    <filter id="shBlur4"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4.5 0"/></filter>
    <filter id="shBlur5"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="6 0"/></filter>
    <filter id="shBlur6"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="8 0"/></filter>
    <filter id="shBlur7"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="11 0"/></filter>
    <filter id="shBlur8"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="15 0"/></filter>
    <filter id="shBlur9"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="20 0"/></filter>
    <filter id="shBlur10" x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="27 0"/></filter>
  </defs>
</svg>

<!-- ============================ THE ENTRANCE ============================= -->
<div class="ent" id="ent">
  <!-- mp4 FIRST. It is listed first in every lab on this branch: webm's seek
       latency was measured at a 154ms median against the mp4's ~0ms, and the
       skip-to-end below is a seek. -->
  <video class="ent__video" id="heroVideo" muted playsinline preload="auto"
         poster="assets/hero/messengers-hero-video-poster.jpg" aria-hidden="true">
    <source src="assets/hero/messengers-hero-video.mp4" type="video/mp4">
    <source src="assets/hero/messengers-hero-video.webm" type="video/webm">
  </video>
  <div class="ent__scrim" aria-hidden="true"></div>

  <!-- THE WORDMARK — outside .ent__copy entirely, because it is anchored to the
       bottom of .ent rather than centred with the rest of the copy. See the
       .ent__stack note above for why it left the shared cell.

       .wm__inner is what js/shutter-text.js is handed as its eyebrow: the
       driver writes element.style.transform directly to lift it 6px, and .wm
       itself carries translateX(-50%) for centring, which that write would
       destroy. The inner element owns no position, so the driver can have it.

       The rule is aria-hidden — it is a registration mark, and the accessible
       name should be the two words and nothing else. -->
  <div class="wm" id="wordmark">
    <span class="wm__inner">
      <span class="wm__line"><span class="wm__ink">Kundalini</span></span>
      <span class="wm__rule" aria-hidden="true">
        <i class="wm__tick wm__tick--l"><i></i><i></i><i></i></i>
        <span class="wm__reticle"><i></i></span>
        <i class="wm__tick wm__tick--r"><i></i><i></i><i></i></i>
      </span>
      <span class="wm__line"><span class="wm__ink">Spines</span></span>
    </span>
  </div>

  <div class="ent__copy">
    <!-- The stack now holds the headline alone. It is kept rather than
         flattened because the shutter driver still puts transforms on the
         headline and its slats, and the grid cell is what gives those a stable
         box to move inside. -->
    <div class="ent__stack">
      <!-- TWO LINES, TWO SHUTTERS — one grid across both would put a slat
           boundary through the interline gap. .sh-hold keeps it dark until the
           webfont has landed, because the slat grid is measured against the
           real face and Arial Narrow's metrics misplace every boundary,
           silently. -->
      <h1 class="scrub__title text-stencil shutter sh-hold" id="title">
        <span class="sh-line" data-text="Knowledge Hidden"><span class="shutter__text">Knowledge Hidden</span></span>
        <span class="sh-line" data-text="in Plain Sight"><span class="shutter__text">in Plain Sight</span></span>
      </h1>
    </div>

    <!-- The scramble module reads its label out of this element and leaves the
         .dot span alone, so the markup needs no other change. Uppercased by
         CSS; the module keeps an aria-label so the accessible name stays
         "ENTER THE SIGNAL" while textContent is mid-decode noise. -->
    <button type="button" class="ent__enter" id="enter">
      <span class="dot" aria-hidden="true"></span> Enter the Signal
    </button>
  </div>

  <button type="button" class="ent__skip" id="skip">Skip</button>
</div>

<!-- ============================ THE NAVIGATOR ===========================
     Markup is the navigator's own, unchanged, so js/spine-ui.js finds what it
     expects (#spine-nav-stage, #spine-nav, #spine-card, .spine-connectors,
     #spine-hint). The only additions are the two coil wrappers around
     .spine__anat.
     ====================================================================== -->
<main class="spine-stage" id="spine-nav-stage" aria-hidden="true">

  <svg class="spine-connectors" aria-hidden="true">
    <path class="conn-active"></path>
    <path class="conn-head"></path>
  </svg>

  <div class="spine" aria-hidden="true">
    <div class="ent-coil ent-coil--back">
      <div class="ent-coil__box"><canvas id="coilBack"></canvas></div>
    </div>

    <div class="spine__anat"></div>

    <div class="ent-coil ent-coil--front">
      <div class="ent-coil__box"><canvas id="coilFront"></canvas></div>
    </div>

    <div class="spine__cord"></div>
    <div class="spine__energy"></div>
  </div>

  <div class="spine__nodes" id="spine-nav" role="toolbar" aria-orientation="vertical" aria-label="Spine navigation">
    <!-- populated by js/spine-ui.js from its NODES[] -->
  </div>

  <article class="spine-card" id="spine-card" role="dialog" aria-modal="false" aria-labelledby="spine-card-title" hidden>
    <button type="button" class="spine-card__close" aria-label="Close">&times;</button>
    <div class="spine-card__head">
      <span class="spine-card__idx"></span>
      <span class="spine-card__flag">Active</span>
    </div>
    <span class="label spine-card__eyebrow"></span>
    <h2 class="spine-card__title" id="spine-card-title"></h2>
    <div class="spine-card__rule"></div>
    <div class="spine-card__body"></div>
    <a class="spine-card__cta" href="#"><span class="cta-text">Explore</span> <span class="arrow" aria-hidden="true">&rarr;</span></a>
  </article>

  <p class="spine-hint" id="spine-hint"><span class="label">Hover a node &middot; click to open &middot; Esc to close</span></p>
</main>

<script src="js/spine-ui.js"></script>
<script src="js/spine-coil.js"></script>
<script src="js/shutter-text.js"></script>
<script src="js/text-scramble.js"></script>
<script src="js/wordmark.js"></script>

<script>
/* ==========================================================================
   THE SEQUENCE

   Four states, one direction, no way back: playing -> settling -> open -> nav.
   Every transition is idempotent, because three different inputs can trigger
   the same one (the video ending, the skip button, and a wheel gesture that
   arrives while a seek is already in flight).
   ========================================================================== */
(function () {
  'use strict';

  var ent    = document.getElementById('ent');
  var video  = document.getElementById('heroVideo');
  var title  = document.getElementById('title');
  var enter  = document.getElementById('enter');
  var skipEl = document.getElementById('skip');
  var stage  = document.getElementById('spine-nav-stage');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var settled = false, handed = false;

  /* HOW THE WORDMARK ARRIVES — the owner's choice, Aug 10 2026: 'cut'.

       'cut'      not on screen at all while the messengers are walking, then
                  simply THERE on the frame the clip cuts away from them. No
                  fade, no development — the film's own edit is the reveal.
       'develop'  the ink-development built into js/wordmark.js. Implemented in
                  full and not chosen; it stays because it costs nothing to keep.
       'none'     inked from the first frame.

     Why 'cut' won: it is a single gesture that takes no time at all, and the
     entrance already spends a shutter reveal and a scramble decode in the four
     seconds AFTER this. A slow arrival here would have been the third. */
  var WM_ARRIVAL = 'cut';

  /* THE CUT, MEASURED — not estimated, and not a round number by accident.

     The clip runs at 24.000fps (frame duration 0.04167s, read off
     requestVideoFrameCallback's own mediaTime deltas). Scanning 4.10..4.25 at
     0.01s, the frames at 4.14 / 4.15 / 4.16 are PIXEL-IDENTICAL and 4.17 jumps
     by 37.4 mean levels — the messengers are gone and the lattice fills the
     frame. So frame 99 spans 4.1250..4.1667 and frame 100 begins at 4.1667
     exactly: 100/24.

     Written as the fraction rather than 4.1667 so it stays exact, and so it is
     obvious what it means if the clip is ever recut or re-encoded. */
  var WM_CUT_AT = 100 / 24;
  var cutArmed = true;

  /* TUNING HOLD. Set once the ?tune panel exists, and it suppresses every
     automatic settle for the rest of the session — the 1400ms paused-video
     watchdog, the 'ended' handler, and skip().

     It exists because tuning is incompatible with the sequence running itself.
     Pausing the clip to look at the lockup is precisely the condition the
     watchdog treats as "autoplay was refused", so it settles, fades the video
     out and reveals star-bg.css behind it — and because the clip's closing
     nebula and the star field are near-identical by design, that looks like the
     video is still there while showing the wrong layer entirely. */
  var tuneHold = false;

  /* ---- the seek guard.

     THIS IS NOT DEFENSIVE PROGRAMMING, IT IS A MEASURED FAILURE MODE.
     python -m http.server answers media requests with 200 and no Accept-Ranges
     header. Chrome reads that as "not seekable" and reports video.seekable as
     [[0,0]] even when video.buffered is the entire clip — and then EVERY
     currentTime write clamps silently to 0. No console error; seeking and
     seeked both fire and seeked reports 0.

     Unguarded, that turns Skip into "restart the video from the beginning",
     which is the worst possible reading of a skip button and gives no clue
     where to look. Serve with scripts/serve.py, which answers 206 properly —
     but the page must not DEPEND on someone having done that. */
  function canSeek(v) {
    return v.seekable && v.seekable.length > 0 && v.seekable.end(0) > 0;
  }

  /* ---- 1. playback.
     Muted autoplay is normally permitted. If it is refused — low power mode,
     some mobile defaults — nothing here breaks: the video simply sits on its
     poster and the watchdog below opens the door anyway. The old scroll-scrub
     had the reader's own scrolling as its safety net; with no scroll at all,
     this timer IS the safety net. */
  var p = video.play();
  if (p && p.catch) p.catch(function () {});

  window.setTimeout(function () {
    if (!settled && (video.paused || video.currentTime < 0.1)) settle(true);
  }, 1400);

  video.addEventListener('ended', function () { settle(false); });

  /* ---- 2. settle: the video hands over to the star field, the eyebrow fades
     out and the headline shutters in.

     `cut` picks the short fade: it is true when we could not reach the last
     frame, so the picture on screen is mid-clip rather than the nebula and
     lingering on it only advertises the jump. */
  function settle(cut) {
    if (tuneHold) return;      /* the ?tune panel owns playback — see above */
    if (settled) return;
    settled = true;
    ent.classList.add(cut ? 'is-cut' : 'is-settled');
    try { video.pause(); } catch (e) {}

    // drop the decoded surface once it is invisible, not before
    var fade = cut ? 200 : 620;
    window.setTimeout(function () { video.classList.add('is-dropped'); }, fade + 60);

    shutter.play();
    window.setTimeout(openDoor, reduce ? 0 : shutter.total());
  }

  /* The door opens and its label decodes, in that order and on the same beat.

     scramble.play() goes BEFORE focus(): the module re-decodes on focus, and
     focusing first would start a run and then immediately restart it. Its own
     mid-run guard makes that harmless, but the ordering says what is intended.

     The decode is the SECOND decode in four seconds — the headline shutters,
     then this. That was the owner's call with the risk stated. If it ever
     reads as one gesture too many, this line is where to cut it, not the
     module. */
  function openDoor() {
    ent.classList.add('is-open');
    if (scramble) scramble.play();
    enter.focus({ preventScroll: true });
  }

  /* ---- 3. skip. Button, Enter, or a wheel gesture — all three land here.

     It seeks to the END and lets the reveal play, rather than jumping straight
     past everything: the reveal is under a second and it is the part the whole
     entrance is built around. Where seeking is impossible the fallback is not
     a degraded version of the same idea, it is the same destination reached
     differently — and because the clip ends on a nebula that is nearly the
     star field already, the two routes look almost identical anyway. */
  function skip() {
    if (settled) return;

    /* DISARM THE CUT. Skip seeks to the last frame, which is well past
       WM_CUT_AT, so the next presented frame would satisfy the cue and the
       lockup would snap on — about 120ms before settle() hands over and the
       shutter immediately fades it out again. A wordmark that appears for an
       eighth of a second on its way out is worse than one that never appears,
       and the reader who pressed skip has said they do not want this beat. */
    cutArmed = false;
    if (canSeek(video) && isFinite(video.duration)) {
      video.currentTime = Math.max(0, video.duration - 0.05);
      // 'ended' does not reliably fire from a seek to the very end
      window.setTimeout(function () { settle(false); }, 120);
    } else {
      settle(true);
    }
  }

  skipEl.addEventListener('click', skip);
  window.addEventListener('wheel', function () { skip(); }, { passive: true });
  window.addEventListener('keydown', function (e) {
    if (settled) return;
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { e.preventDefault(); skip(); }
  });

  /* ---- 4. the handoff to the navigator, and the serpents.

     The coil fires as soon as the navigator is VISIBLE rather than on the
     click, so it reads as something the spine does on arrival rather than as
     feedback for pressing a button. One shot: it runs up the column once and
     is gone for the session. */
  var coil = null;

  function hand() {
    if (handed) return;
    handed = true;
    ent.classList.add('is-gone');
    stage.classList.add('is-live');
    stage.removeAttribute('aria-hidden');

    window.setTimeout(function () {
      ent.style.display = 'none';
      if (reduce) return;
      if (!coil) {
        coil = SpineCoil.create({
          back:  document.getElementById('coilBack'),
          front: document.getElementById('coilFront'),
          config: SpineCoil.readCssVars(document.documentElement)
        });
      }
      coil.run();
      var first = document.querySelector('.spine-node');
      if (first) first.focus({ preventScroll: true });
    }, 520);
  }

  enter.addEventListener('click', hand);

  /* ---- the wordmark. Mounted now; it holds itself invisible until the webfont
     has landed, because it justifies the two lines from measured widths and
     fallback metrics would silently justify it to the wrong numbers.

     It plays when the clip does, NOT on DOM ready: the development is scored to
     the footage. The messengers walk toward camera through the first ~4.2s, and
     the ink consolidating over that stretch is the wordmark arriving with them.
     By the time the clip cuts to the lattice at ~4.5s the lockup is solid and
     simply holds until settle. */
  var wordmark = Wordmark.mount(document.getElementById('wordmark'), {
    family: 'Archivo', weight: 900,
    stage: ent,
    /* THE TUNER ALWAYS SHOWS IT, and that is not a shortcut. Under 'cut' the
       lockup does not exist for the clip's first 4.17 seconds, and a lockup
       that is not on screen cannot be positioned. Placement and timing are
       separate jobs; the panel owns the first, a reload without ?tune shows
       the second.

       Reduced motion also gets it immediately. A hard cut is not really motion,
       but arriving from nothing is still an event, and the setting asks for
       fewer of those. */
    onready: function (wm) {
      if (tuneHold || reduce || WM_ARRIVAL === 'none') { wm.settle(); return; }
      if (WM_ARRIVAL === 'develop') { wm.play(); return; }
      armCut();
    }
  });

  /* ---- the cut cue.

     requestVideoFrameCallback, NOT timeupdate. timeupdate fires about four
     times a second, so it can be up to 250ms — SIX FRAMES at 24fps — late, and
     a cut that lands six frames after the edit is not a cut, it is a mistake
     that looks like a bug. rVFC hands back the mediaTime of the frame actually
     being presented, which is precisely the quantity WM_CUT_AT is defined
     against, so the lockup and the new shot appear on the same paint.

     The timeupdate path below is a real fallback for browsers without rVFC, and
     it is knowingly less accurate. It is still much better than nothing: being
     a few frames late is survivable, never arriving is not. */
  function armCut() {
    if (!cutArmed) { return; }

    if (typeof video.requestVideoFrameCallback === 'function') {
      var step = function (now, meta) {
        if (!cutArmed) { return; }
        if (meta.mediaTime >= WM_CUT_AT - 0.001) { fireCut(); return; }
        video.requestVideoFrameCallback(step);
      };
      video.requestVideoFrameCallback(step);
      return;
    }

    var onTime = function () {
      if (!cutArmed) { video.removeEventListener('timeupdate', onTime); return; }
      if (video.currentTime >= WM_CUT_AT) {
        video.removeEventListener('timeupdate', onTime);
        fireCut();
      }
    };
    video.addEventListener('timeupdate', onTime);
  }

  /* settle(), not play(): the module's settle is the instant, transition-free
     jump to the inked state. play() would run the development. */
  function fireCut() {
    if (!cutArmed) { return; }
    cutArmed = false;
    wordmark.settle();
  }

  /* ---- the reveal itself. Mounted now, played at settle.

     The shutter's eyebrow is .wm__inner, not .wm. The driver writes
     element.style.transform to lift the outgoing eyebrow 6px, and .wm carries
     translateX(-50%) for its own centring — hand it .wm and the lockup jumps
     half its own width sideways on the first frame of the cross-fade. */
  var shutter = ShutterText.mount(title, { eyebrow: document.querySelector('.wm__inner') });

  /* ---- the door's label. Mounted now so the slot grid is measured while the
     button is laid out but still invisible; played at openDoor. Mounting is
     what nails each character to one advance width, so an unmounted button
     would visibly resize the moment the first decode ran. */
  var scramble = window.TextScramble ? TextScramble.mount(enter) : null;

  /* ======================================================================
     THE WORDMARK TUNE PANEL.  ?tune on the URL, nothing otherwise.

     Every field writes a custom property on #wordmark and re-runs layout().
     COPY VALUES emits a paste-ready :root block for css/wordmark.css, so the
     numbers reach the stylesheet as the owner set them rather than as I
     transcribed them.

     THE VIDEO SCRUB SUPPRESSES THE WATCHDOG, and that is not optional.
     entrance-lab.html settles itself 1400ms in if the video is paused, which
     fades the clip out and reveals star-bg.css behind it. Since the clip's
     closing nebula and the star field are near-identical by design, the result
     is a scrub that appears to work while actually showing the wrong layer —
     it cost a whole measurement pass earlier today before it was spotted.
     ====================================================================== */
  if (/[?&]tune\b/.test(location.search)) { buildTunePanel(); }

  function buildTunePanel() {
    tuneHold = true;               /* nothing auto-settles from here on */
    var wmEl = document.getElementById('wordmark');

    /* [prop, label, min, max, step, unit, default, tip] */
    /* Defaults MUST match css/wordmark.css. They are the owner's settled values
       as of Aug 10 2026 — a panel default that disagrees with the stylesheet
       turns RESET from a revert into a silent edit. */
    var FIELDS = [
      ['--wm-bottom',  'vertical',    0,   46,  0.5, '%',  34.5,
       'Distance up from the bottom edge. The messengers’ heads occupy y 115-355 at 1440x900 for the clip’s first 4.17s, so this is about as low as the lockup can sit before it crosses faces.'],
      ['--wm-shift',   'horizontal',  -320, 320, 1,  'px', 0,
       'Nudge off centre. 0 is centred on the spine. NOTE: this panel sits OVER ' +
       'the stage, so at 0 the lockup looks pushed right while the panel is open — ' +
       'hit HIDE before judging horizontal, or you will dial in a shift that is ' +
       'really just the panel’s width.'],
      ['--wm-measure', 'width',       0.28, 0.95, 0.005, '', 0.585,
       'Fraction of the stage the LONG line spans. Type size follows from this — the lockup is sized so KUNDALINI fills the measure, never stretched to it.'],
      ['--wm-track',   'tracking',   -0.09, 0.10, 0.002, 'em', 0.046,
       'Letter-spacing. NEGATIVE is what matches the reference — its letters ' +
       'nearly touch, which is what lets the type be set big enough to read as a ' +
       'heavy slab. Tightening also sizes the lockup UP, because the measure is ' +
       'fixed and the type grows to fill it.'],
      ['--wm-gap',     'line gap',    0,   0.5, 0.005, 'em', 0,
       'Air above and below the registration rule.'],
      ['--wm-rule-on', 'rule',        0,   1,   1,   '',  1,
       'The hairline, ticks and reticle between the words. 0 removes them.'],
      /* 180 matches css/wordmark.css. A panel default that disagrees with the
         stylesheet makes RESET a silent edit rather than a revert. */
      ['--wm-grain-to','grain scale', 60,  900, 5,   'px', 180,
       'Size of the letterpress tile lifted from your reference. 180px matches ' +
       'the reference’s own texture-to-cap ratio; bigger reads as damage, smaller ' +
       'closes up into flat noise.'],
      ['--wm-grain-floor','grain opacity', 0, 1, 0.01, '', 0.25,
       'How opaque the BLACK marks in the type are. 0 = fully transparent, so the ' +
       'footage shows through every speck and the grain changes as the clip moves ' +
       'behind it — watch it across the whole opening, it looks very different over ' +
       'the messengers than over the nebula. 1 = fully inked, no breakup at all. ' +
       'This raises the mask floor rather than fading the element, so the letterforms ' +
       'themselves never lose density.']
    ];

    var panel = document.createElement('aside');
    panel.className = 'wtune';
    panel.innerHTML =
      '<div class="wtune__head"><span>Wordmark</span>' +
        '<button type="button" class="wtune-btn" data-hide style="flex:0 0 auto">hide</button></div>' +
      '<div class="wtune__body">' +
        '<div class="wtune-sec">Face</div><div data-face></div>' +
        '<div class="wtune-sec">Placement</div><div data-fields></div>' +
        '<div class="wtune-sec">Clip</div><div data-clip></div></div>' +
      '<div class="wtune__foot">' +
        '<button type="button" class="wtune-btn" data-reset>reset</button>' +
        '<button type="button" class="wtune-btn" data-copy>copy values</button>' +
        '<textarea class="wtune-out" data-out readonly></textarea></div>';
    document.body.appendChild(panel);

    var tab = document.createElement('button');
    tab.type = 'button'; tab.className = 'wtune-tab'; tab.textContent = 'Wordmark';
    document.body.appendChild(tab);

    var host = panel.querySelector('[data-fields]');
    var out  = panel.querySelector('[data-out]');
    var live = {};

    /* ---- the face.
       Teko is here because the owner's reference turned out to BE Teko Bold —
       the filename said so — and it was not in the specimen sheet the first
       choice was made from. Archivo 900/62 is what that sheet produced.
       font-stretch is per-face and load-bearing: Archivo's compressed cut is
       selected by the 62% descriptor and falls back silently without it, while
       Teko has no width axis and must ask for 100%. */
    var FACES = {
      archivo: ['"Archivo", "Arial Narrow", sans-serif', '900', '62%',  '"wdth" 62'],
      teko:    ['"Teko", "Arial Narrow", sans-serif',    '700', '100%', 'normal']
    };
    var faceWrap = document.createElement('div');
    faceWrap.className = 'wfld';
    faceWrap.innerHTML =
      '<div class="wfld__top"><span class="wfld__lab">typeface</span></div>' +
      '<select style="width:100%;margin-top:5px;background:rgba(5,5,5,0.7);' +
      'border:1px solid rgba(216,208,190,0.28);color:var(--text-primary);' +
      'font-family:inherit;font-size:11px;padding:5px">' +
      '<option value="archivo">Archivo 900 / width 62</option>' +
      '<option value="teko">Teko Bold 700 — the reference’s own face</option>' +
      '</select>' +
      '<span class="wfld__tip">Teko is what the reference image was set in. ' +
      'Switching re-runs the justification, so the size and scaleX both change.</span>';
    panel.querySelector('[data-face]').appendChild(faceWrap);

    var faceSel = faceWrap.querySelector('select');
    faceSel.addEventListener('change', function () {
      var f = FACES[faceSel.value];
      wmEl.style.setProperty('--wm-font', f[0]);
      wmEl.style.setProperty('--wm-weight', f[1]);
      wmEl.style.setProperty('--wm-stretch', f[2]);
      wmEl.querySelector('.wm__inner').style.fontVariationSettings = f[3];
      live['--wm-font'] = f[0];
      live['--wm-weight'] = f[1];
      live['--wm-stretch'] = f[2];
      wordmark.layout();
    });

    FIELDS.forEach(function (f) {
      var prop = f[0], lab = f[1], min = f[2], max = f[3], step = f[4],
          unit = f[5], def = f[6], tip = f[7];
      var wrap = document.createElement('div');
      wrap.className = 'wfld';
      wrap.innerHTML =
        '<div class="wfld__top"><span class="wfld__lab">' + lab + '</span>' +
        '<span class="wfld__val"></span></div>' +
        '<input type="range" min="' + min + '" max="' + max + '" step="' + step + '">' +
        '<span class="wfld__tip">' + tip + '</span>';
      var input = wrap.querySelector('input');
      var val   = wrap.querySelector('.wfld__val');
      input.value = def;

      function apply() {
        var v = parseFloat(input.value);
        live[prop] = v + unit;
        wmEl.style.setProperty(prop, v + unit);
        val.textContent = v + unit;
        wrap.classList.toggle('is-dirty', v !== def);
        /* width and gap change the box, so the justification has to be redone —
           the scale factors are ratios of MEASURED widths, not of the settings */
        wordmark.layout();
      }
      input.addEventListener('input', apply);
      wrap.querySelector('.wfld__val').textContent = def + unit;
      host.appendChild(wrap);
      f.push(input, apply, wrap);
      apply();
    });

    /* ---- the clip scrub. */
    var clipWrap = document.createElement('div');
    clipWrap.className = 'wfld';
    clipWrap.innerHTML =
      '<div class="wfld__top"><span class="wfld__lab">time</span>' +
      '<span class="wfld__val">live</span></div>' +
      '<input type="range" min="0" max="8.76" step="0.02" value="0">' +
      '<span class="wfld__tip">Scrub the clip and judge the lockup against any frame. ' +
      'Messengers 0.00-4.17s, lattice 4.17-7s, nebula 7s to the end 8.77s. The cut ' +
      'out of the messengers is on frame 100, t=4.1667 (the clip is 24.00fps). ' +
      'Scrubbing pauses; use play below to resume.</span>';
    panel.querySelector('[data-clip]').appendChild(clipWrap);

    var clip = clipWrap.querySelector('input');
    var clipVal = clipWrap.querySelector('.wfld__val');

    /* Undo anything a settle managed to apply before the panel took over, and
       put the video back on screen. Called before every transport action. */
    function reclaim() {
      ent.classList.remove('is-settled', 'is-cut');
      video.classList.remove('is-dropped');
      video.style.opacity = '1';
    }

    function showTime() {
      clipVal.textContent = video.paused
        ? video.currentTime.toFixed(2) + 's  paused'
        : video.currentTime.toFixed(2) + 's';
    }

    clip.addEventListener('input', function () {
      reclaim();
      try { video.pause(); } catch (e) {}
      if (canSeek(video)) {
        video.currentTime = parseFloat(clip.value);
        showTime();
      } else {
        clipVal.textContent = 'NO RANGE — server has no 206';
      }
      syncTransport();
    });

    /* ---- transport: pause/play and restart.

       The scrub used to set the sequence's own `settled` flag to disarm the
       watchdog. That worked but it was a lie — it told the rest of the page the
       entrance had finished when it had not, so anything later keying off
       `settled` would have read the wrong state. tuneHold says what is actually
       true: the tuner has taken the wheel. */
    var trans = document.createElement('div');
    trans.className = 'wfld';
    trans.innerHTML =
      '<div style="display:flex;gap:6px;margin-top:2px">' +
      '<button type="button" class="wtune-btn" data-play style="flex:2 1 auto"></button>' +
      '<button type="button" class="wtune-btn" data-restart style="flex:1 1 auto">restart</button>' +
      '</div>' +
      '<span class="wfld__tip">The sequence will NOT settle or hand off to the ' +
      'navigator while this panel is open — it holds on the last frame instead, ' +
      'so the lockup stays put while you work. Reload without ?tune to see the ' +
      'whole thing run.</span>';
    panel.querySelector('[data-clip]').appendChild(trans);

    var playBtn = trans.querySelector('[data-play]');

    function syncTransport() {
      playBtn.textContent = video.paused ? '▶  play' : '‖  pause';
      showTime();
    }

    playBtn.addEventListener('click', function () {
      reclaim();
      if (video.paused) {
        /* holding on the very last frame: rewind rather than refuse, otherwise
           the button looks broken at the end of the clip */
        if (video.currentTime >= video.duration - 0.05 && canSeek(video)) {
          video.currentTime = 0;
        }
        var pr = video.play();
        if (pr && pr.catch) { pr.catch(function () {}); }
      } else {
        video.pause();
      }
      syncTransport();
    });

    trans.querySelector('[data-restart]').addEventListener('click', function () {
      reclaim();
      if (canSeek(video)) { video.currentTime = 0; }
      video.pause();
      clip.value = 0;
      syncTransport();
    });

    /* Keep the slider and the label honest while it plays, without a rAF loop —
       timeupdate is coarse (~4/sec) and that is plenty for a readout. */
    video.addEventListener('timeupdate', function () {
      if (!video.paused) { clip.value = video.currentTime; }
      showTime();
    });
    video.addEventListener('play', syncTransport);
    video.addEventListener('pause', syncTransport);

    /* Hold on the last frame instead of settling. */
    video.addEventListener('ended', function () {
      reclaim();
      syncTransport();
    });

    syncTransport();

    panel.querySelector('[data-reset]').addEventListener('click', function () {
      FIELDS.forEach(function (f) { f[8].value = f[6]; f[9](); });
      out.classList.remove('is-shown');
    });

    panel.querySelector('[data-copy]').addEventListener('click', function () {
      var lines = [];
      /* the face first, and only when it is not the authored default —
         otherwise the pasted block silently re-states what is already there */
      ['--wm-font', '--wm-weight', '--wm-stretch'].forEach(function (k) {
        if (live[k]) { lines.push('  ' + k + ': ' + live[k] + ';'); }
      });
      FIELDS.forEach(function (f) {
        lines.push('  ' + f[0] + ': ' + f[8].value + f[5] + ';');
      });
      out.value = '.wm {\n' + lines.join('\n') + '\n}';
      out.classList.add('is-shown');
      out.select();
      try { document.execCommand('copy'); } catch (e) {}
    });

    function setOpen(open) {
      panel.classList.toggle('is-collapsed', !open);
      tab.classList.toggle('is-shown', !open);
    }
    panel.querySelector('[data-hide]').addEventListener('click', function () { setOpen(false); });
    tab.addEventListener('click', function () { setOpen(true); });
  }

  /* ---- verification hook. The captures and the page take the same path — a
     lab where they differ is a lab that cannot be trusted. */
  window.__entrance = {
    settle: settle, skip: skip, hand: hand,
    shutter: shutter,
    wordmark: wordmark,
    /* scramble-lab.html sets window.__scramble itself; the MODULE does not, so
       a consuming page has to expose its own instance or every seek() in a
       capture script silently no-ops against undefined and the frames come
       back live rather than frozen. */
    scramble: function () { return scramble; },
    coil: function () { return coil; },
    canSeek: function () { return canSeek(video); },
    state: function () {
      return {
        settled: settled, handed: handed,
        cls: ent.className,
        videoT: +video.currentTime.toFixed(3),
        seekable: video.seekable.length ? [video.seekable.start(0), +video.seekable.end(0).toFixed(3)] : [],
        navOpacity: getComputedStyle(stage).opacity,
        wmFontLoaded: wordmark.fontLoaded,
        wmMetrics: wordmark.metrics || null,
        wmCls: document.getElementById('wordmark').className
      };
    }
  };
})();
</script>
</body>
</html>
