<!DOCTYPE html>
<!-- ==========================================================================
     HERO SCRUB -> SPINE ASTER — ENTRANCE LAB   (isolated; zero production files
     touched. index.html and js/hero-video.js are NOT modified by this page.)

     The sequence, per the owner's decision Aug 9 2026:
       1. hero video, scrubbed by scroll (not autoplayed)
       2. the spine aster reveals as its OWN full-screen beat
       3. navigation comes after that

     MEASURED, and it dictates the markup below: the two hero encodes are not
     interchangeable for scrubbing.
         mp4  8.77s  1920x1080  seeks resolve in ~0ms after the first
         webm 8.78s  1920x1080  median seek 154ms, peaks at 250ms
     index.html lists webm FIRST, so Chrome picks the slow one and a scrub built
     on that source stutters. Here mp4 is listed first ON PURPOSE. Do not
     "restore" source order to match index.html without re-measuring — the
     production page autoplays straight through, where seek latency never shows,
     so its order is correct for it and wrong for this.

     One consequence worth a decision: the production hero has a sound toggle.
     Scrubbed audio is meaningless, so there is no toggle here. If the hero keeps
     sound, the scrub cannot also be the way it is watched.
     ========================================================================== -->
<html lang="en" class="page-home">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Scrub → Spine Aster · Kundalini Spines</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Big+Shoulders+Stencil:wght@700;900&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/star-bg.css">

<style>
:root {
  --kick: 0; --snare: 0; --charge: 0;
  --kick-stars: 0; --kick-cloud: 0; --snare-bolt: 0;

  /* how much scroll each beat costs, in viewport heights.
     260 rather than the 340 first tried: at 340 the 8.77s hero costs roughly 18
     wheel notches to get through, which turns the entrance into a chore. 260
     lands near 12 — deliberate, not laborious. */
  --scrub-vh:      260;
  --beat-vh:       260;
  --handoff:       0.12;   /* fraction of the scrub spent dissolving into the sky */

  /* aster look — carried over from spine-aster-lab.html */
  --aster-h:       86vh;
  --outline-color: 242, 242, 238;
  --outline-a:     0.92;
  --mesh-a:        0.55;
  --scan-a:        0.95;
  --scan-h:        110px;
  --feather:       7%;
  --breathe:       0.012;
  --breathe-ms:    7600ms;
  --reveal-ms:     2600ms;
  --reveal-ease:   cubic-bezier(0.22, 0.61, 0.36, 1);
  --mesh-delay:    900ms;
  --mesh-ms:       1600ms;
}

@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }

/* PLANNED, next session (owner, Aug 9 2026): .aster__scan is a placeholder shape.
   It becomes concentric amber rings matching the navigation reticle — same
   --node-color 240,165,92, same continuous-ripple feel as node-pulse in
   spine-lab.html — but oriented as a HULA HOOP around the column, travelling up
   it and beaming upward, rather than a flat line lying across it. Stated as a
   direction to work from, not a fixed spec. Note it implies perspective: a ring
   encircling the spine reads as an ellipse whose minor axis varies with height,
   so it likely wants a rotateX 3D transform or an animated SVG ellipse, not a
   flat circle. Whatever replaces it, keep the --scan-live gating below and keep
   its position welded to the same --p that drives the mask. */

/* --scan-live gates the leading edge on ACTUAL MOTION.
   Under scroll-linking the cue parks wherever the reader stops, so a thing whose
   whole job is to say "this is moving" sits glowing at a standstill. Registering
   it as a <number> lets the factor itself transition while --p keeps resolving
   from scroll, so the edge fades out on its own instead of smearing the wipe.
   Fast in, slow out: it should appear the instant motion resumes and leave
   unhurriedly, not blink. */
@property --scan-live { syntax: '<number>'; inherits: true; initial-value: 0; }

/* ---------------------------------------------------------------- beat 1 */
.scrub { position: relative; height: calc(var(--scrub-vh) * 1vh); }
.scrub__stick {
  position: sticky; top: 0; height: 100svh; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
/* The hero DISSOLVES into the star field over the last --handoff of the scrub
   rather than cutting to it. Nothing is painted behind the video here, so fading
   it out reveals the page's own sky (star-bg.css) — which is the same space the
   aster then draws itself onto. Without this the sticky simply releases and you
   get a hard horizontal seam between two sections. */
.scrub__video,
.scrub__scrim {
  position: absolute; inset: 0;
  opacity: calc(1 - max((var(--p) - (1 - var(--handoff))) / var(--handoff), 0));
}
.scrub__video { width: 100%; height: 100%; object-fit: cover; }
.scrub__scrim {
  background: linear-gradient(180deg, rgba(5,5,5,0.55), rgba(5,5,5,0.25) 45%, rgba(5,5,5,0.85));
}
.scrub__copy {
  position: relative; z-index: 2; text-align: center; max-width: 62ch; padding: 0 var(--space-6);
  /* the copy clears out as the scrub advances, so the video reads at the end */
  opacity: calc(1 - var(--p) * 1.9);
  transform: translateY(calc(var(--p) * -40px));
}
.scrub__title {
  font-family: var(--font-display); font-weight: 800; font-size: var(--fs-h1);
  line-height: var(--lh-heading); letter-spacing: var(--tracking-display);
  color: var(--text-primary); margin: 0 0 var(--space-4);
}
.scrub__statement { font-family: var(--font-body); font-size: var(--fs-body);
  line-height: var(--lh-body); color: var(--text-secondary); margin: 0; }

/* ---------------------------------------------------------------- beat 2 */
.beat { position: relative; height: calc(var(--beat-vh) * 1vh); }
.beat__stick {
  position: sticky; top: 0; height: 100svh; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.aster {
  position: relative; height: var(--aster-h); aspect-ratio: 1200 / 2150;
  animation: aster-breathe var(--breathe-ms) var(--ease-standard) infinite;
}
.aster__layer { position: absolute; inset: 0; }
.aster__wipe {
  position: absolute; inset: 0;
  -webkit-mask-image: linear-gradient(to top, #000 calc(var(--p) * 100%), transparent calc(var(--p) * 100% + var(--feather)));
          mask-image: linear-gradient(to top, #000 calc(var(--p) * 100%), transparent calc(var(--p) * 100% + var(--feather)));
}
.aster__outline { color: rgb(var(--outline-color)); opacity: var(--outline-a); }
.aster__outline svg { width: 100%; height: 100%; display: block; }
.aster__outline path { fill: currentColor; }
.aster__mesh {
  background: url("assets/hero/spine-aster-mesh.webp") center / contain no-repeat;
  opacity: calc(var(--mesh-a) * var(--mesh-on));
}
/* --p lives on the STICKY wrapper, not on the wipe: the scan line is a sibling
   of the wipe, so a value set on the wipe never reaches it and the leading edge
   would sit frozen while the mask travelled. One value, common ancestor. */
.aster__scan {
  position: absolute; left: -6%; right: -6%; height: var(--scan-h);
  bottom: calc(var(--p) * 100% - var(--scan-h) / 2);
  background: radial-gradient(ellipse at center,
      rgba(255,250,244, var(--scan-a)) 0%,
      rgba(240,165,92, calc(var(--scan-a) * 0.55)) 32%,
      transparent 72%);
  filter: blur(2px); pointer-events: none;
  /* present only while the wipe is actually travelling — and only while the
     reader is actually moving it (--scan-live). */
  opacity: calc(min(var(--p) * 14, 1)
              * (1 - max((var(--p) - 0.93) * 14, 0))
              * var(--scan-live));
}
/* Declared on .aster, NOT on .beat__stick: that element already carries the --p
   transition in timed mode, and a second `transition` on the same element would
   replace it rather than add to it. .aster is the scan line's parent, so the
   value still inherits down. */
.aster                    { --scan-live: 0; transition: --scan-live 420ms ease; }
.is-moving .aster         { --scan-live: 1; transition: --scan-live 90ms ease; }
@keyframes aster-breathe {
  0%, 100% { transform: scaleY(1); }
  50%      { transform: scaleY(calc(1 + var(--breathe))); }
}

/* SCROLL mode: --p is written from scroll position, no transition.
   TIMED mode: --p is flipped to 1 once and transitions on its own clock. */
.beat__stick { --mesh-on: 0; }
.beat__stick.is-lit { --mesh-on: 1; }
.beat__stick.mode-timed { transition: --p var(--reveal-ms) var(--reveal-ease); }
.beat__stick.mode-timed .aster__mesh {
  transition: opacity var(--mesh-ms) var(--ease-standard) var(--mesh-delay);
}

/* ---------------------------------------------------------------- beat 3 */
.after { min-height: 100svh; display: flex; align-items: center; justify-content: center; }
.after__inner { text-align: center; }
.after__inner p { color: var(--color-gray-400); font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase; }
.after__rule { width: 1px; height: 90px; margin: 0 auto var(--space-5);
  background: linear-gradient(180deg, transparent, rgba(216,208,190,0.5)); }

/* ---------------------------------------------------------------- chrome */
.hud {
  position: fixed; inset: auto 0 0 0; z-index: 60;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  padding: 10px 16px; background: linear-gradient(0deg, rgba(5,5,5,0.9), rgba(5,5,5,0));
  font-family: var(--font-mono); font-size: 11px; color: var(--color-gray-400);
}
.hud b { color: var(--text-primary); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 42px; display: inline-block; }
.hud .btn {
  padding: 6px 11px; cursor: pointer; background: transparent;
  border: 1px solid rgba(216,208,190,0.36); color: var(--text-secondary);
  font-family: inherit; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
}
.hud .btn:hover { color: var(--text-primary); border-color: var(--color-bone); }
.hud input[type=range] { width: 100px; }

@media (prefers-reduced-motion: reduce) {
  /* no scrubbing, no wipe — the poster frame and a fully present spine. */
  .scrub { height: 100svh; }
  .beat  { height: 100svh; }
  .beat__stick { --p: 1; --mesh-on: 1; transition: none; }
  .aster { animation: none; }
  .aster__scan { display: none; }
  .scrub__copy { opacity: 1; transform: none; }
}
</style>
</head>
<body>

<section class="scrub" id="scrub">
  <div class="scrub__stick" id="scrubStick">
    <!-- mp4 FIRST, deliberately — see the head comment. Not looping, not
         autoplaying: scroll owns currentTime. -->
    <video id="heroVideo" class="scrub__video" poster="assets/hero/messengers-hero-video-poster.jpg"
           muted playsinline preload="auto" aria-hidden="true">
      <source src="assets/hero/messengers-hero-video.mp4" type="video/mp4">
      <source src="assets/hero/messengers-hero-video.webm" type="video/webm">
    </video>
    <div class="scrub__scrim" aria-hidden="true"></div>
    <div class="scrub__copy">
      <span class="label">Kundalini Spines</span>
      <h1 class="scrub__title text-stencil">Knowledge Hidden<br>in Plain Sight</h1>
      <p class="scrub__statement">Two Messengers. One Signal. Scroll to run the transmission.</p>
    </div>
  </div>
</section>

<section class="beat" id="beat">
  <div class="beat__stick" id="beatStick">
    <div class="aster">
      <div class="aster__wipe">
        <div class="aster__layer aster__mesh" aria-hidden="true"></div>
        <div class="aster__layer aster__outline" id="outline"></div>
      </div>
      <div class="aster__scan" aria-hidden="true"></div>
    </div>
  </div>
</section>

<section class="after">
  <div class="after__inner">
    <div class="after__rule"></div>
    <p>Navigation continues here</p>
  </div>
</section>

<div class="hud">
  <span>scrub <b id="pv">0.00</b></span>
  <span>video <b id="tv">0.00s</b></span>
  <span>aster <b id="av">0.00</b></span>
  <span>reveal <button type="button" class="btn" id="mode">Scroll-linked</button></span>
  <button type="button" class="btn" id="latch">Latch: on</button>
  <span>scrub len <input type="range" id="slen" min="150" max="600" step="10" value="260"><b id="slenv">260vh</b></span>
  <span>handoff <input type="range" id="hoff" min="0" max="0.4" step="0.01" value="0.12"><b id="hoffv">0.12</b></span>
  <button type="button" class="btn" id="top">Back to top</button>
</div>

<script>
(function () {
  'use strict';
  var root   = document.documentElement;
  var video  = document.getElementById('heroVideo');
  var scrub  = document.getElementById('scrub');
  var sStick = document.getElementById('scrubStick');
  var beat   = document.getElementById('beat');
  var bStick = document.getElementById('beatStick');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var pv = document.getElementById('pv'), tv = document.getElementById('tv'), av = document.getElementById('av');

  document.getElementById('outline').innerHTML = '<span style="color:var(--color-gray-500)">loading…</span>';
  fetch('assets/hero/spine-aster.svg').then(function (r) { return r.text(); })
    .then(function (t) { document.getElementById('outline').innerHTML = t; })
    .catch(function (e) {
      document.getElementById('outline').textContent = 'spine-aster.svg failed — serve over http, not file://';
      console.error(e);
    });

  function clamp01(n) { return n < 0 ? 0 : n > 1 ? 1 : n; }
  function progress(el) {
    var r = el.getBoundingClientRect();
    var travel = el.offsetHeight - window.innerHeight;
    return travel <= 0 ? 0 : clamp01(-r.top / travel);
  }

  // ---- video scrubbing.
  // currentTime is written at most once per frame. Writing it on every scroll
  // event queues seeks faster than the decoder retires them, which is what makes
  // naive scrub implementations feel like glue even on a fast source.
  var wantT = 0, queued = false, ready = false;

  // Both of these check readyState FIRST and only then fall back to the event.
  // Media events do not replay: on a warm cache the video is already readyState 4
  // by the time this script runs, the event never fires, and a listener-only
  // version sits dead forever while the scroll maths keeps working perfectly —
  // scrub advances, video frozen at frame 0. Measured exactly that here.
  function markReady() { ready = true; }
  if (video.readyState >= 1) markReady();
  else video.addEventListener('loadedmetadata', markReady);

  // prime the decoder — a video that has never decoded a frame seeks slowly the
  // first time, which lands exactly on the user's first scroll if left to chance.
  function prime() {
    var p = video.play();
    if (p && p.then) p.then(function () { video.pause(); video.currentTime = 0; }).catch(function () {});
    else { try { video.pause(); } catch (e) {} }
  }
  if (video.readyState >= 3) prime();
  else video.addEventListener('canplay', prime, { once: true });

  function pump() {
    queued = false;
    if (!ready || !isFinite(video.duration)) return;
    var t = wantT * video.duration;
    if (Math.abs(video.currentTime - t) > 0.01) video.currentTime = t;
    tv.textContent = video.currentTime.toFixed(2) + 's';
  }

  var timedFired = false;
  var asterMax = 0;      // high-water mark for the latch
  var latched = true;    // forward-only by default
  function mode() { return bStick.classList.contains('mode-timed') ? 'timed' : 'scroll'; }

  function onScroll() {
    var ps = progress(scrub);
    sStick.style.setProperty('--p', ps.toFixed(4));
    pv.textContent = ps.toFixed(2);
    if (!reduce) { wantT = ps; if (!queued) { queued = true; requestAnimationFrame(pump); } }

    var pb = progress(beat);
    if (mode() === 'scroll') {
      // Latch: --p ratchets FORWARD only. Raw scroll progress runs backwards as
      // well, so scrolling up disassembles the spine vertebra by vertebra — fine
      // for judging the wipe, wrong for the real thing, where a transmission that
      // has arrived should not un-arrive. It resets only once the beat is fully
      // off screen, so the entrance still replays from the top.
      if (pb <= 0.001) asterMax = 0; else asterMax = Math.max(asterMax, pb);
      var pEff = latched ? asterMax : pb;
      bStick.style.setProperty('--p', pEff.toFixed(4));
      bStick.classList.toggle('is-lit', pEff > 0.02);
      av.textContent = pEff.toFixed(2);
    } else {
      // timed: the reveal runs on its own clock, fired once the beat is on screen
      if (!timedFired && pb > 0.02) {
        timedFired = true;
        bStick.style.setProperty('--p', '1');
        bStick.classList.add('is-lit');
        av.textContent = 'firing';
        // hold the edge lit for the length of the reveal — here the motion IS
        // the animation, so it must not be gated on the reader scrolling.
        markMoving((parseFloat(getComputedStyle(root).getPropertyValue('--reveal-ms')) || 2600) + 200);
      } else if (timedFired && pb <= 0.001) {
        timedFired = false;
        bStick.style.setProperty('--p', '0');
        bStick.classList.remove('is-lit');
        av.textContent = '0.00';
      }
    }
  }

  // ---- motion gate for the leading edge.
  // Scroll fires in bursts, so "is the reader moving" is really "has a scroll
  // event landed recently". 110ms of silence counts as stopped — long enough to
  // ride out the gaps between wheel notches, short enough that letting go reads
  // as letting go. The fade itself is CSS (--scan-live), so this only flips a class.
  var stillTimer = null;
  function markMoving(holdMs) {
    bStick.classList.add('is-moving');
    window.clearTimeout(stillTimer);
    stillTimer = window.setTimeout(function () {
      bStick.classList.remove('is-moving');
    }, holdMs || 110);
  }

  window.addEventListener('scroll', function () {
    // in timed mode the reveal runs on its own clock, so scrolling is not what
    // makes it move — markMoving is driven from the firing point instead.
    if (mode() === 'scroll') markMoving();
    onScroll();
  }, { passive: true });
  window.addEventListener('resize', onScroll);

  document.getElementById('mode').addEventListener('click', function () {
    var timed = bStick.classList.toggle('mode-timed');
    this.textContent = timed ? 'Timed once' : 'Scroll-linked';
    timedFired = false;
    asterMax = 0;
    bStick.style.setProperty('--p', '0');
    bStick.classList.remove('is-lit');
    onScroll();
  });

  document.getElementById('latch').addEventListener('click', function () {
    latched = !latched;
    this.textContent = 'Latch: ' + (latched ? 'on' : 'off');
    asterMax = 0;
    onScroll();
  });

  var slen = document.getElementById('slen'), slenv = document.getElementById('slenv');
  slen.addEventListener('input', function () {
    root.style.setProperty('--scrub-vh', slen.value);
    slenv.textContent = slen.value + 'vh';
    onScroll();
  });

  var hoff = document.getElementById('hoff'), hoffv = document.getElementById('hoffv');
  hoff.addEventListener('input', function () {
    root.style.setProperty('--handoff', hoff.value);
    hoffv.textContent = hoff.value;
    onScroll();
  });

  document.getElementById('top').addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  onScroll();
})();
</script>
</body>
</html>
