<!DOCTYPE html>
<!-- ==========================================================================
     SHUTTER TEXT LAB — "Knowledge Hidden in Plain Sight" assembling out of
     horizontal slats, on the real star field.  (Isolated: this page and its two
     assets, css/shutter-text.css and js/shutter-text.js, are the only files it
     touches. index.html, hero-scrub-lab.html, spine-lab.html and coil-lab.html
     are NOT modified.)

     WHAT TO JUDGE HERE, in order:
       1. the headline shuttering in — five slats across the cap height, each
          entering from the left under horizontal motion blur with an amber
          ghost running ahead of it
       2. "KUNDALINI SPINES" cross-fading OUT underneath it, on the same clock

     Beat 2 does NOT shutter. That was decided before it was built: two shutters
     back to back stops reading as a signature and starts reading as a tic. The
     eyebrow gets the one gesture the headline does not have — a straight fade
     with a 6px lift — so the two beats stay distinguishable while overlapping.

     THE MEASUREMENTS behind every number are in the block comment at the top of
     css/shutter-text.css. Short version: band count, pitch, per-band travel,
     ghost offset and the duration were all read off frames from the owner's
     screen recording of the paywalled "Hero Shutter Text" component — the two
     that carry the geometry are ref2/d02_2.04s.png and ref2/d04_2.18s.png. The
     component's source is locked and was not consulted.

     TYPEFACE. Big Shoulders DISPLAY 800, not the Stencil cut, even though the
     production headline carries .text-stencil. That is not a slip: on
     hero-scrub-lab.html .scrub__title already overrides the stencil family and
     keeps only its text-shadow, so this matches what the page renders TODAY.
     It is also the right call for this effect — stencil bridges are horizontal
     white gaps through the glyphs, and slicing horizontal slats through them
     puts two competing horizontal rhythms on the same letterforms and the word
     stops being readable mid-run. If the hero ever goes truly stencil, the
     slat count has to come down and be re-judged against the bridges.
     ========================================================================== -->
<!-- The page class belongs on <html>, not <body> — html::before and html::after
     are two of the four star layers in css/star-bg.css. Same rule as index.html. -->
<html lang="en" class="page-home">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shutter Text · Kundalini Spines</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Big+Shoulders+Stencil:wght@700;900&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/star-bg.css">
<link rel="stylesheet" href="css/shutter-text.css">

<style>
:root {
  /* THE SKY IS REACTIVE AND THIS PAGE HAS NO AUDIO ENGINE. css/star-bg.css and
     css/spine-bg.css declare --kick / --snare / --charge as inputs written per
     frame by js/spine-bg.js. Without that script they are undefined, every
     calc() that references one becomes invalid, and the twinkle amplitude and
     nebula amplitude fall back to their initial values instead of their idle
     values — the sky renders, but not the sky index.html shows. Stubbing them
     at 0 is what "idle" means. Do not delete these because the page looks fine
     on your machine; it is the calc() chain that breaks, not the image. */
  --kick: 0; --snare: 0; --charge: 0;
  --kick-stars: 0; --kick-cloud: 0; --snare-bolt: 0;

  /* Amber, quoted from spine-lab.html's --node-color rather than approximated,
     so the ghost, the coil in hero-scrub-lab.html and the navigator's nodes are
     literally the same three numbers. NOT --color-crimson: see the COLOUR note
     in css/shutter-text.css — #5E0A0A is darker than the bone text and only
     just above the star field, so it reads as a smudge, not as light. */
  --sh-ghost: 240, 165, 92;
}

html, body { height: 100%; }
body { margin: 0; }

main {
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 var(--space-6) 120px;
}

/* A scrim, same idea as .scrub__scrim on hero-scrub-lab.html: the star field
   is a photograph and the nebula band runs diagonally through the middle of it,
   which is exactly where the headline sits. Without this the amber ghost
   competes with the brightest part of the sky. */
.stage {
  position: relative;
  width: 100%;
  max-width: 62ch;
  text-align: center;
  padding: var(--space-16) var(--space-6);
  cursor: pointer;
}
.stage::before {
  content: "";
  position: absolute;
  inset: -10% -20%;
  z-index: -1;
  background: radial-gradient(60% 55% at 50% 50%, rgba(5,5,5,0.72), rgba(5,5,5,0) 70%);
  pointer-events: none;
}

/* Quoted verbatim from .scrub__title / .scrub__statement on
   hero-scrub-lab.html so the headline here is the same object being judged,
   at the same size, not a lookalike. */
.scrub__title {
  font-family: var(--font-display); font-weight: 800; font-size: var(--fs-h1);
  line-height: var(--lh-heading); letter-spacing: var(--tracking-display);
  margin: 0 0 var(--space-4);
  /* BONE, not --text-primary, and this is the one line that departs from
     hero-scrub-lab.html's .scrub__title. Two reasons and they agree: the owner
     specified Archive Bone for this headline, and bone is the warm neutral the
     amber ghost resolves INTO — on Signal White the amber reads as a stain the
     letters have to shake off, on bone it reads as the same light cooling. */
  color: var(--color-bone);
}
.scrub__statement {
  font-family: var(--font-body); font-size: var(--fs-body);
  line-height: var(--lh-body); color: var(--text-secondary); margin: 0;
}

/* Held dark until the webfont has landed and the slats have been measured
   against it — capMetrics() on a fallback face returns Arial Narrow's cap
   height and misplaces every slat boundary. Removed by the script. */
.sh-hold { opacity: 0; }

.stage__hint {
  display: block; margin-top: var(--space-8);
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: var(--tracking-label); text-transform: uppercase;
  color: var(--color-gray-400);
}

/* ---------------------------------------------------------------- chrome */
/* Same HUD as hero-scrub-lab.html — bottom bar, mono, amber range accent. */
.hud {
  position: fixed; inset: auto 0 0 0; z-index: 60;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  padding: 10px 16px; background: linear-gradient(0deg, rgba(5,5,5,0.9), rgba(5,5,5,0));
  font-family: var(--font-mono); font-size: 11px; color: var(--color-gray-400);
}
.hud b { color: var(--text-primary); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 46px; display: inline-block; }
.hud .btn {
  padding: 6px 11px; cursor: pointer; background: transparent;
  border: 1px solid rgba(216,208,190,0.36); color: var(--text-secondary);
  font-family: inherit; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
}
.hud .btn:hover { color: var(--text-primary); border-color: var(--color-bone); }
/* accent-color, not a hand-built track — one line recolours fill and thumb in
   Chrome/Firefox/Safari and keeps the focus ring. Chrome's default #1a73e8 is
   the one saturated cool hue on a page that is otherwise bone and amber, so it
   reads as browser chrome rather than as part of the instrument. */
.hud input[type=range] { width: 92px; accent-color: rgb(240, 165, 92); }
html.hud-min .hud > *:not(.hud__toggle) { display: none; }
html.hud-min .hud { background: none; padding: 8px 16px; }

/* 375px. The HUD wraps to five rows on a phone and would bury the headline, so
   it starts collapsed below 600px — the effect is the thing being judged, not
   the sliders. The stage padding also comes down; at 375px the copy column is
   the viewport and --fs-h1 clamps to its 2rem floor. */
@media (max-width: 600px) {
  .stage { padding: var(--space-8) 0; }
  .hud { gap: 8px; font-size: 10px; }
}
</style>
</head>
<body>

<!-- Zero-size, out of flow. TEN filters, stdDeviation "N 0" — the second value
     is 0 on purpose: that is what makes the blur DIRECTIONAL. CSS filter:blur()
     is isotropic and smears the slats vertically into one another, which is the
     one thing the reference never does. stdDeviation is not a CSS property, so
     it cannot be driven by a custom property; the script points each copy at a
     rung of this ladder instead (see SD[] in js/shutter-text.js).
     color-interpolation-filters="sRGB" is load-bearing — the SVG default is
     linearRGB, which lightens the amber ghost and washes the bone text as they
     blur, so the settled colour and the mid-flight colour would not match. -->
<svg class="sh-filters" aria-hidden="true" focusable="false">
  <defs>
    <filter id="shBlur1"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1 0"/></filter>
    <filter id="shBlur2"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="2 0"/></filter>
    <filter id="shBlur3"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3 0"/></filter>
    <filter id="shBlur4"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4.5 0"/></filter>
    <filter id="shBlur5"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="6 0"/></filter>
    <filter id="shBlur6"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="8 0"/></filter>
    <filter id="shBlur7"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="11 0"/></filter>
    <filter id="shBlur8"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="15 0"/></filter>
    <filter id="shBlur9"  x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="20 0"/></filter>
    <filter id="shBlur10" x="-60%" y="-10%" width="220%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="27 0"/></filter>
  </defs>
</svg>

<main id="main">
  <div class="stage" id="stage">
    <span class="label sh-eyebrow" id="eyebrow">Kundalini Spines</span>

    <!-- TWO LINES, TWO SHUTTERS. The production markup is
           <h1 class="scrub__title text-stencil">Knowledge Hidden<br>in Plain Sight</h1>
         and the <br> is replaced by two .sh-line blocks here because each line
         needs its own positioning context and its own slat grid.

         WHY PER-LINE AND NOT ONE GRID ACROSS BOTH: a single grid spanning the
         pair puts a slat boundary through the interline gap and puts line 1's
         descenders in the same slat as line 2's ascenders, so that slat tears
         two different words sideways at once — a glitch, not a shutter. It also
         halves the slat pitch relative to the reference, which slices ONE cap
         height into five. Per-line grids hold the measured pitch (cap/5) no
         matter how many lines the headline grows to, which is also what keeps
         the effect legible at 375px where the type is at its 2rem floor.

         The two lines are NOT simultaneous — line 2 starts 70ms after line 1
         (the "lead" slider). In lockstep the pair reads as one tall block
         sliding; 70ms is enough for the eye to see two events without the
         second feeling like a separate animation.

         data-text is the source of truth for each slat's text: the slats are
         appended INSIDE .sh-line, so reading textContent on a rebuild would
         pick up the copies as well. -->
    <h1 class="scrub__title text-stencil shutter sh-hold" id="title">
      <span class="sh-line" data-text="Knowledge Hidden"><span class="shutter__text">Knowledge Hidden</span></span>
      <span class="sh-line" data-text="in Plain Sight"><span class="shutter__text">in Plain Sight</span></span>
    </h1>

    <p class="scrub__statement">Two Messengers. One Signal. Scroll to run the transmission.</p>
    <span class="stage__hint" id="hint">Click anywhere to re-shutter</span>
  </div>
</main>

<div class="hud">
  <button type="button" class="btn hud__toggle" id="hudToggle">Hide</button>
  <button type="button" class="btn" id="replay">Replay</button>
  <span>bands <input type="range" id="bands" min="3" max="9" step="1" value="5"><b id="bandsv">5</b></span>
  <span>run <input type="range" id="run" min="150" max="900" step="10" value="430"><b id="runv">430ms</b></span>
  <span>stagger <input type="range" id="stag" min="0" max="90" step="1" value="22"><b id="stagv">22ms</b></span>
  <span>lead <input type="range" id="lead" min="0" max="240" step="5" value="70"><b id="leadv">70ms</b></span>
  <span>travel <input type="range" id="trav" min="0.3" max="2" step="0.05" value="1"><b id="travv">1.00x</b></span>
  <!-- The ghost slider is here because the accent strength is the one number
       that does NOT transfer from the reference. Its violet sits on a white
       page, where a saturated hue reads as a dark stamp; amber sits on a black
       sky, where the same alpha reads as a dim glow. The default is matched to
       the measured accent decay, but the level is a call to be made on the
       owner's own display, not on a screenshot. -->
  <span>ghost <input type="range" id="ghost" min="0" max="1.6" step="0.05" value="1"><b id="ghostv">1.00x</b></span>
  <span>total <b id="totalv">588ms</b></span>
  <span>freeze <input type="range" id="scrub" min="0" max="588" step="1" value="0"><b id="scrubv">—</b></span>
  <span id="rm"></span>
</div>

<script src="js/shutter-text.js"></script>
<script>
(function () {
  'use strict';

  var title   = document.getElementById('title');
  var eyebrow = document.getElementById('eyebrow');
  var stage   = document.getElementById('stage');
  var sh = ShutterText.mount(title, { eyebrow: eyebrow });

  var el = {};
  ['replay','bands','bandsv','run','runv','stag','stagv','lead','leadv',
   'trav','travv','ghost','ghostv','totalv','scrub','scrubv','hudToggle','rm','hint']
    .forEach(function (id) { el[id] = document.getElementById(id); });

  function syncTotal() {
    var t = sh.total();
    el.totalv.textContent = Math.round(t) + 'ms';
    el.scrub.max = Math.round(t);
    return t;
  }

  function readHud() {
    sh.set({
      bands:    parseInt(el.bands.value, 10),
      run:      parseInt(el.run.value, 10),
      stagger:  parseInt(el.stag.value, 10),
      lineLead: parseInt(el.lead.value, 10),
      travel:   parseFloat(el.trav.value),
      ghost:    parseFloat(el.ghost.value)
    });
    el.bandsv.textContent = el.bands.value;
    el.runv.textContent   = el.run.value + 'ms';
    el.stagv.textContent  = el.stag.value + 'ms';
    el.leadv.textContent  = el.lead.value + 'ms';
    el.travv.textContent  = parseFloat(el.trav.value).toFixed(2) + 'x';
    el.ghostv.textContent = parseFloat(el.ghost.value).toFixed(2) + 'x';
    syncTotal();
  }

  ['bands','run','stag','lead','trav','ghost'].forEach(function (id) {
    el[id].addEventListener('input', function () {
      readHud();
      el.scrubv.textContent = '—';
      sh.play();
    });
  });

  /* The freeze slider is the same entry point the screenshot rig uses
     (window.__shutter.seek), so what the owner drags through and what the
     captures show are the same code path — a lab where the two differ is a lab
     that cannot be trusted. */
  el.scrub.addEventListener('input', function () {
    var ms = parseInt(el.scrub.value, 10);
    el.scrubv.textContent = ms + 'ms';
    sh.seek(ms);
  });

  el.replay.addEventListener('click', function (e) {
    e.stopPropagation();
    el.scrubv.textContent = '—';
    sh.play();
  });
  stage.addEventListener('click', function () {
    el.scrubv.textContent = '—';
    sh.play();
  });

  el.hudToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var min = document.documentElement.classList.toggle('hud-min');
    el.hudToggle.textContent = min ? 'HUD' : 'Hide';
  });
  /* Collapsed on phones from the start — see the 600px block in the stylesheet. */
  if (window.matchMedia('(max-width: 600px)').matches) {
    document.documentElement.classList.add('hud-min');
    el.hudToggle.textContent = 'HUD';
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.rm.textContent = 'reduced-motion: plain fade';
    el.hint.textContent = 'Click anywhere to replay (reduced motion)';
  }

  /* Slats are measured against the rendered face, so nothing is built until the
     webfont has actually arrived. document.fonts.ready resolves immediately when
     the font is cached, so this is not a delay in practice — it is insurance
     against the first uncached load, where measuring Arial Narrow's cap height
     and applying it to Big Shoulders puts every slat boundary in the wrong
     place. The .catch keeps the headline from staying at opacity 0 forever if
     the Google Fonts request fails offline. */
  function start() {
    readHud();
    title.classList.remove('sh-hold');
    sh.play();
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(start).catch(start);
  } else {
    start();
  }

  /* Verification hook. Absolute control of the clock from the outside:
       __shutter.seek(220)   freeze at 220ms
       __shutter.play()      run it
       __shutter.total()     current total in ms  */
  window.__shutter = sh;
}());
</script>
</body>
</html>
