<!DOCTYPE html>
<!-- ==========================================================================
     SPINE FIELD LAB — six readings of "fill the empty space"

     THE PROBLEM, in the owner's words: the spine is the centrepiece and the
     star field is the background, but with no card open the screen reads as
     EMPTY. The left and right thirds of a 1440x900 stage carry nothing.

     THE OWNER'S OWN FIRST IDEA was to set the wordmark in huge thin-line type
     behind the spine, using the spine itself as a letterform, revealed on
     mouseover. The instinct is right and is kept -- reveal-on-approach is this
     brand's actual thesis, since the entrance headline is literally "Knowledge
     Hidden in Plain Sight". Two things about the execution were not:

       1. The wordmark plays at full size in the entrance about four seconds
          earlier. Restating it is a film putting its title card up twice.
       2. For the spine to be a letter AND stay centred, the word has to break
          asymmetrically -- KUNDALIN|I| is six letters left and two right --
          against a layout that is otherwise rigorously centred.

     So the graphic move survives and the subject changes: what gets revealed
     is the CHAKRA SYSTEM, which fills the same space, is thematically exact
     for a project called Kundalini Spines, and does something the wordmark
     cannot -- it gives the visitor a KEY to what the object in the middle of
     their screen actually is. Right now they see a beautiful diagram with no
     legend.

     SIX READINGS, each testing a different theory of WHY it feels empty:
       PLATE     — it lacks structure. Anatomical leader lines to the margins.
       GRATICULE — it lacks measurement. A targeting/instrument overlay.
       HALO      — it lacks company, not marks. Quiet marginalia + vesica rings.
       MANDALA   — it wants to be a diagram, not a page. Geometry goes big.
       CROP      — it lacks graphic weight. Enormous cropped type + a torch.
       READOUT   — it lacks information density. Instrument columns as texture.
     Plus NONE, the control: the screen exactly as it ships today. Kept for the
     same reason music-collapse-lab.html keeps GHOST and the glass lab keeps
     FROST -- six readings cannot be judged without the thing they are
     replacing, and "it was already fine" has to stay available as an answer.

     WHAT THIS HOST OWES EACH MODULE (the contract they were built against):
       - #field, absolutely positioned over the stage at z-index 1, which is
         below .spine (10), .spine-connectors (15), .spine__nodes (20),
         .spine-card (25) and .spine-hint (30). The field is under everything.
       - pointer-events: none, so nothing here can ever eat a click.
       - html.v-<name> while that module is active. Every module scopes all of
         its CSS under that class, which is what lets six coexist in one page.
       - html.is-card while a reading card is open, html.is-music while Music
         is open. Modules dim themselves on the first and vanish on the second.
       - mount(root) / unmount(root) called on switch.

     NOTHING HERE IS LIVE ON ANY REAL PAGE. css/spine-ui.css is untouched.
     ========================================================================== -->
<html lang="en" class="page-home">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine field — six readings</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/star-bg.css">
<link rel="stylesheet" href="css/spine-ui.css">

<!-- The six modules. Each scopes everything under its own html.v-* class, so
     load order between them does not matter and they cannot collide. -->
<link rel="stylesheet" href="css/field/v-plate.css">
<link rel="stylesheet" href="css/field/v-graticule.css">
<link rel="stylesheet" href="css/field/v-halo.css">
<link rel="stylesheet" href="css/field/v-mandala.css">
<link rel="stylesheet" href="css/field/v-crop.css">
<link rel="stylesheet" href="css/field/v-readout.css">
<!-- LAST, and it must be: fusion only overrides its two parents, so it has to
     come after both of them in the cascade. -->
<link rel="stylesheet" href="css/field/v-fusion.css">

<style>
html, body { height: 100%; }
body { margin: 0; overflow: hidden; }

/* THE FIELD CONTAINER — the one piece of shared surface. Everything about it
   is deliberately minimal: the modules own their own look, this owns only
   where they live and what they can never do. */
.field {
  position: absolute; inset: 0;
  z-index: 1;              /* under .spine (10) and everything above it */
  pointer-events: none;    /* it can never eat a click, in any variant */
  overflow: hidden;        /* CROP's oversized type is cropped BY THE STAGE */
}

/* ---- lab furniture, none of which ports ---- */
.lab-ctl {
  position: fixed; left: 20px; top: 20px; z-index: 90;
  display: flex; flex-direction: column; gap: 6px;
  font-family: var(--font-mono);
}
.lab-ctl__head {
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--color-gray-500); margin-bottom: 2px;
}
.lab-ctl button {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; padding: 7px 12px; cursor: pointer; text-align: left;
  background: rgba(5,5,5,0.86); color: var(--color-gray-400);
  border: 1px solid rgba(216,208,190,0.22); min-width: 190px;
}
.lab-ctl button:hover { border-color: rgba(var(--node-color),0.7); color: var(--color-bone); }
.lab-ctl button[aria-pressed="true"] {
  border-color: rgb(var(--node-color)); color: #fff; background: rgba(5,5,5,0.95);
}
.lab-ctl button b { font-weight: 500; color: inherit; }
.lab-ctl button i { display: block; font-style: normal; font-size: 9px;
  letter-spacing: 0.04em; text-transform: none; color: var(--color-gray-500);
  margin-top: 2px; }

/* HIDING THE PANEL IS NOT A CONVENIENCE, IT IS PART OF JUDGING.
   Every one of the six readings puts something in the top-left -- PLATE's
   registration bracket, GRATICULE's ordinate numerals, READOUT's entire first
   column -- and this panel is fixed there at z-index 90 over a field at
   z-index 1. All five module authors flagged it independently. Judge a reading
   with the panel up and you are judging it on three quarters of itself.
   H toggles, or click the tab. Deliberately NOT auto-hiding on mouse-out: a
   panel that vanishes while you are reaching for it is worse than one you
   dismiss. */
html.ctl-off .lab-ctl__body { display: none; }
.lab-ctl__tab {
  align-self: flex-start;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.18em;
  text-transform: uppercase; padding: 6px 10px; cursor: pointer;
  background: rgba(5,5,5,0.7); color: var(--color-gray-500);
  border: 1px solid rgba(216,208,190,0.18);
}
.lab-ctl__tab:hover { color: var(--color-bone); border-color: rgba(var(--node-color),0.6); }
.lab-ctl__body { display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>

<main class="spine-stage" id="spine-nav-stage">

  <!-- FIRST CHILD, and that is load-bearing. Elements with z-index:auto paint
       in DOM order, so being first is a second guarantee of sitting underneath
       even if a module forgets its own stacking. -->
  <div class="field" id="field" aria-hidden="true"></div>

  <svg class="spine-connectors" aria-hidden="true">
    <path class="conn-active"></path>
    <path class="conn-head"></path>
  </svg>

  <div class="spine" aria-hidden="true">
    <div class="spine__anat"></div>
    <div class="spine__cord"></div>
    <div class="spine__energy"></div>
  </div>

  <div class="spine__nodes" id="spine-nav" role="toolbar" aria-orientation="vertical" aria-label="Spine navigation"></div>

  <article class="spine-card" id="spine-card" role="dialog" aria-modal="false" aria-labelledby="spine-card-title" hidden>
    <button type="button" class="spine-card__close" aria-label="Close">&times;</button>
    <div class="spine-card__head">
      <span class="spine-card__idx"></span>
      <span class="spine-card__flag">Active</span>
    </div>
    <span class="label spine-card__eyebrow"></span>
    <h2 class="spine-card__title" id="spine-card-title"></h2>
    <div class="spine-card__rule"></div>
    <div class="spine-card__body"></div>
    <a class="spine-card__cta" href="#"><span class="cta-text">Explore</span> <span class="arrow" aria-hidden="true">&rarr;</span></a>
  </article>

  <p class="spine-hint" id="spine-hint"><span class="label">Hover a node &middot; click to open &middot; Esc to close</span></p>
</main>

<nav class="lab-ctl" id="labctl" aria-label="Field readings">
  <button type="button" class="lab-ctl__tab" id="ctltab" aria-expanded="true">Panel &middot; H</button>
  <div class="lab-ctl__body" id="ctlbody">
    <span class="lab-ctl__head">Field reading</span>
  </div>
</nav>

<script src="js/spine-ui.js"></script>
<script src="js/field/v-plate.js"></script>
<script src="js/field/v-graticule.js"></script>
<script src="js/field/v-halo.js"></script>
<script src="js/field/v-mandala.js"></script>
<script src="js/field/v-crop.js"></script>
<script src="js/field/v-readout.js"></script>
<!-- after its parents, which it calls -->
<script src="js/field/v-fusion.js"></script>

<script>
(function () {
  'use strict';

  var READINGS = [
    ['none',      'None — control',  'The screen exactly as it ships today'],
    ['plate',     'Plate',           'Anatomical leader lines to the margins'],
    ['graticule', 'Graticule',       'Measurement overlay, frequencies only'],
    ['halo',      'Halo',            'Quiet marginalia over vesica rings'],
    ['mandala',   'Mandala',         'Geometry goes big; the page is a diagram'],
    ['crop',      'Crop',            'Enormous cropped type, revealed by a torch'],
    ['readout',   'Readout',         'Instrument columns as texture'],
    ['fusion',    'Fusion',          'PLATE callouts over MANDALA geometry']
  ];

  var root   = document.documentElement;
  var field  = document.getElementById('field');
  var ctl    = document.getElementById('ctlbody');
  var stage  = document.getElementById('spine-nav-stage');
  var active = null;

  /* MIRROR THE STAGE'S is-card ONTO <html>.
     js/spine-ui.js already toggles `.is-card` on .spine-stage, so the state
     exists and does not need inventing -- but a module scoped under
     `html.v-plate` cannot reach a class on a mid-page element with a plain
     descendant selector. Mirroring it up is one observer and it means every
     module can write `html.is-card .field { ... }` and be done. */
  new MutationObserver(function () {
    root.classList.toggle('is-card', stage.classList.contains('is-card'));
  }).observe(stage, { attributes: true, attributeFilter: ['class'] });

  function show(name) {
    if (active === name) return;
    /* Unmount before the class flips, so a module's teardown still sees its
       own styles applied — anything measuring on the way out gets real
       numbers rather than the unscoped defaults. */
    if (active && active !== 'none' && window.__field && window.__field[active]) {
      try { window.__field[active].unmount(field); } catch (e) { console.error(active + '.unmount', e); }
    }
    READINGS.forEach(function (r) { root.classList.remove('v-' + r[0]); });
    field.innerHTML = '';

    active = name;
    root.classList.add('v-' + name);
    if (name !== 'none') {
      var mod = window.__field && window.__field[name];
      if (!mod) { console.warn('field module missing:', name); }
      else { try { mod.mount(field); } catch (e) { console.error(name + '.mount', e); } }
    }
    Array.prototype.forEach.call(ctl.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.name === name));
    });
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
  }

  READINGS.forEach(function (r) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.name = r[0];
    b.innerHTML = '<b>' + r[1] + '</b><i>' + r[2] + '</i>';
    b.addEventListener('click', function () { show(r[0]); });
    ctl.appendChild(b);
  });

  /* Number keys jump between readings — the fastest way to A/B two of them is
     to flip back and forth without moving the pointer to a button. */
  var tab = document.getElementById('ctltab');
  function togglePanel() {
    var off = root.classList.toggle('ctl-off');
    tab.setAttribute('aria-expanded', String(!off));
  }
  tab.addEventListener('click', togglePanel);

  document.addEventListener('keydown', function (e) {
    var i = '12345678'.indexOf(e.key);
    if (i >= 0 && READINGS[i]) { show(READINGS[i][0]); return; }
    /* H for the panel, and the arrows for stepping — the fastest way to judge
       six readings is to hold the pointer still and change only the thing
       being judged. */
    if (e.key === 'h' || e.key === 'H') { togglePanel(); return; }
    var cur = READINGS.map(function (r) { return r[0]; }).indexOf(active);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { show(READINGS[(cur + 1) % READINGS.length][0]); }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { show(READINGS[(cur - 1 + READINGS.length) % READINGS.length][0]); }
  });

  var wanted = (location.hash || '').replace('#', '');
  show(READINGS.some(function (r) { return r[0] === wanted; }) ? wanted : 'plate');

  window.__fieldLab = { show: show, readings: READINGS, current: function () { return active; } };
})();
</script>
</body>
</html>
